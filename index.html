<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коробов в слое</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            color: #1a1a2e;
            margin-bottom: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        label {
            display: block;
            font-size: 15px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            margin-bottom: 16px;
        }
        input:focus {
            border-color: #4a90d9;
        }
        input.err {
            border-color: #e74c3c;
            background: #fff0f0;
        }
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: #4a90d9;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn:hover {
            background: #357abd;
        }
        .result {
            display: none;
        }
        .result.show {
            display: block;
        }
        .result-label {
            text-align: center;
            font-size: 16px;
            color: #888;
            margin-bottom: 8px;
        }
        .result-count {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            color: #4a90d9;
        }
        .fill-row {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 8px;
            margin-top: 8px;
        }
        .fill-key {
            font-size: 14px;
            color: #888;
        }
        .fill-val {
            font-size: 20px;
            font-weight: 700;
            color: #2e7d32;
        }
        .dimensions {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }
        .pallet-size {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }
        .error {
            color: #e74c3c;
            text-align: center;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Коробов в слое</h1>
        <div class="card">
            <label for="boxL">Длина коробки (см)</label>
            <input type="number" id="boxL" placeholder="например, 40" min="1" step="any">
            <label for="boxW">Ширина коробки (см)</label>
            <input type="number" id="boxW" placeholder="например, 26" min="1" step="any">
            <button class="btn" onclick="calc()">Рассчитать</button>
            <div class="error" id="err"></div>
        </div>
        <div class="card result" id="result">
            <div class="result-label">Коробов в слое</div>
            <div class="result-count" id="count">0</div>
            <div class="fill-row">
                <span class="fill-key">Заполняемость</span>
                <span class="fill-val" id="fill">0%</span>
            </div>
            <div class="dimensions" id="dims"></div>
            <div class="pallet-size">Паллета 120 × 80 см</div>
        </div>
    </div>
    <script>
        var L = 120;
        var W = 80;
        var a = document.getElementById("boxL");
        var b = document.getElementById("boxW");

        function n(zw, zh, bw, bh) {
            return Math.floor(zw / bw) * Math.floor(zh / bh);
        }

        function pts(total, d1, d2) {
            var s = {};
            var o = [];
            for (var k = 1; k * d1 <= total; k++) s[k * d1] = 1;
            for (var k = 1; k * d2 <= total; k++) s[k * d2] = 1;
            for (var k = 0; k * d1 < total; k++) s[total - k * d1] = 1;
            for (var k = 0; k * d2 < total; k++) s[total - k * d2] = 1;
            for (var p in s) {
                var v = +p;
                if (v > 0 && v < total) o.push(v);
            }
            return o.sort(function (x, y) { return x - y; });
        }

        function best(bl, bw) {
            var o = [{ w: bl, h: bw }, { w: bw, h: bl }];
            var bc = 0;
            var cfg;
            function t(c, x) { if (c > bc) { bc = c; cfg = x; } }

            for (var i = 0; i < 2; i++)
                t(n(L, W, o[i].w, o[i].h), { t: "s", o: [i] });

            var xp = pts(L, bl, bw);
            var yp = pts(W, bl, bw);

            for (var s of xp)
                for (var i = 0; i < 2; i++)
                    for (var j = 0; j < 2; j++)
                        t(n(s, W, o[i].w, o[i].h) + n(L - s, W, o[j].w, o[j].h), { t: "v2", s: [s], o: [i, j] });

            for (var s of yp)
                for (var i = 0; i < 2; i++)
                    for (var j = 0; j < 2; j++)
                        t(n(L, s, o[i].w, o[i].h) + n(L, W - s, o[j].w, o[j].h), { t: "h2", s: [s], o: [i, j] });

            for (var xs of xp)
                for (var ys of yp)
                    for (var i = 0; i < 2; i++)
                        for (var j = 0; j < 2; j++)
                            for (var k = 0; k < 2; k++)
                                for (var l = 0; l < 2; l++)
                                    t(n(xs, ys, o[i].w, o[i].h) + n(L - xs, ys, o[j].w, o[j].h) +
                                      n(xs, W - ys, o[k].w, o[k].h) + n(L - xs, W - ys, o[l].w, o[l].h),
                                      { t: "x", s: [xs, ys], o: [i, j, k, l] });

            var names = {
                s: "Обычная",
                v2: "Смешанная (верт.)",
                h2: "Смешанная (гориз.)",
                x: "Смешанная"
            };
            return { total: bc, type: names[cfg.t] };
        }

        function calc() {
            var bl = +a.value;
            var bw = +b.value;
            a.classList.remove("err");
            b.classList.remove("err");

            if (!bl || bl <= 0) {
                a.classList.add("err");
                a.focus();
                fail();
                return;
            }
            if (!bw || bw <= 0) {
                b.classList.add("err");
                b.focus();
                fail();
                return;
            }

            var r = best(bl, bw);

            if (!r.total) {
                a.classList.add("err");
                b.classList.add("err");
                fail();
                return;
            }

            document.getElementById("err").classList.remove("show");
            var el = document.getElementById("result");
            el.classList.add("show");
            document.getElementById("count").textContent = r.total;
            document.getElementById("fill").textContent =
                ((r.total * bl * bw) / (L * W) * 100).toFixed(1) + "%";
            document.getElementById("dims").textContent = "Коробка " + bl + " × " + bw + " см";
            el.scrollIntoView({ behavior: "smooth" });
        }

        function fail() {
            document.getElementById("err").textContent = "7 раз отмерь — 1 раз введи";
            document.getElementById("err").classList.add("show");
            document.getElementById("result").classList.remove("show");
        }

        a.oninput = b.oninput = function () { this.classList.remove("err"); };
        a.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); b.focus(); } };
        b.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); calc(); } };
    </script>
</body>
</html>
