<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Мультитул оператора</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        :root{
            --bg:#f0f2f5; --card:#fff; --text:#1a1a2e; --text2:#555; --text3:#888;
            --accent:#4a90d9; --accent-hover:#357abd; --border:#e0e0e0; --err-bg:#fff0f0;
            --err-text:#e74c3c; --green:#2e7d32; --orange:#e67e22; --fill:#2e7d32;
            --result-text:#333; --input-bg:#fff; --input-text:#333;
        }

        .dark{
            --bg:#1a1a2e; --card:#242440; --text:#e0e0e0; --text2:#aaa; --text3:#777;
            --accent:#5a9fe8; --accent-hover:#7ab3f0; --border:#3a3a5c; --err-bg:#3a1a1a;
            --err-text:#ff6b6b; --green:#4caf50; --orange:#ff9800; --fill:#4caf50;
            --result-text:#e0e0e0; --input-bg:#2a2a4a; --input-text:#e0e0e0;
        }

        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:var(--bg); min-height:100vh; padding:16px;
            transition:background .3s ease;
        }
        .container{max-width:600px;margin:0 auto}

        .top-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;position:relative}
        h1{font-size:22px;color:var(--text);text-align:center}
        .theme-btn{
            position:absolute;right:0;top:50%;transform:translateY(-50%);
            background:none;border:none;font-size:24px;cursor:pointer;
            padding:4px 8px;border-radius:8px;
        }
        .theme-btn:hover{background:rgba(128,128,128,.2)}

        .section-title{text-align:center;font-size:18px;color:var(--accent);font-weight:700;margin:28px 0 16px;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:center;gap:10px}
        .section-title .arrow{display:inline-block;transition:transform .2s ease;font-size:14px;color:var(--accent)}
        .section-title .arrow.collapsed{transform:rotate(-90deg)}
        .collapsible{overflow:hidden;transition:max-height .2s ease, opacity .2s ease, margin .2s ease}
        .collapsible.collapsed{max-height:0!important;opacity:0;margin-bottom:0;pointer-events:none}
        .collapsible.expanded{overflow:visible}

        .card{background:var(--card);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);transition:background .3s ease}

        label{display:block;font-size:15px;color:var(--text2);margin-bottom:6px;font-weight:500}
        input{
            width:100%;padding:14px;font-size:18px;border:2px solid var(--border);border-radius:12px;
            outline:none;margin-bottom:16px;scroll-margin-bottom:220px;
            background:var(--input-bg);color:var(--input-text);transition:background .3s ease,color .3s ease;
        }
        input:focus{border-color:var(--accent)}
        input.err{border-color:var(--err-text);background:var(--err-bg)}
        select{
            width:100%;padding:14px;font-size:18px;border:2px solid var(--border);border-radius:12px;
            outline:none;margin-bottom:16px;background:var(--input-bg);color:var(--input-text);
            scroll-margin-bottom:220px;transition:background .3s ease,color .3s ease;
        }
        select:focus{border-color:var(--accent)}

        .btn{
            width:100%;padding:16px;font-size:18px;font-weight:600;color:#fff;
            background:var(--accent);border:none;border-radius:12px;cursor:pointer;
            transition:background .3s ease;
        }
        .btn:hover{background:var(--accent-hover)}
        .btn-sm{
            width:auto;padding:10px 20px;font-size:14px;font-weight:600;
            color:var(--err-text);background:none;border:2px solid var(--err-text);
            border-radius:10px;cursor:pointer;margin:12px auto 0;display:block;
        }
        .btn-sm:hover{background:var(--err-bg)}

        .result{display:none}.result.show{display:block}
        .result-label{text-align:center;font-size:16px;color:var(--text3);margin-bottom:8px}
        .result-count{text-align:center;font-size:48px;font-weight:700;color:var(--accent)}
        .fill-row{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:8px}
        .fill-key{font-size:14px;color:var(--text3)}
        .fill-val{font-size:20px;font-weight:700;color:var(--fill)}
        .dimensions{text-align:center;font-size:13px;color:var(--text3);margin-top:8px}
        .pallet-size{text-align:center;font-size:13px;color:var(--text3);margin-top:4px}
        .error{color:var(--err-text);text-align:center;font-size:15px;font-weight:600;margin-top:12px;display:none}
        .error.show{display:block}

        .row3{display:flex;gap:10px}
        .row3>div{flex:1}
        .row3 input,.row3 select{margin-bottom:16px}
        .row2{display:flex;gap:10px}
        .row2>div{flex:1}
        .row2 select,.row2 input{margin-bottom:16px}

        .expiry-out{text-align:center;font-size:22px;font-weight:700;color:var(--result-text);margin-bottom:12px}
        .left-out{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
        .left-out.red{color:var(--err-text)}
        .left-out.green{color:var(--green)}
        .left-out.orange{color:var(--orange)}

        .history-list{list-style:none}
        .history-item{
            background:var(--card);border:1px solid var(--border);border-radius:12px;
            padding:14px;margin-bottom:10px;cursor:pointer;transition:background .2s ease,border-color .2s ease;
        }
        .history-item:hover{border-color:var(--accent)}
        .history-item .h-type{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:4px}
        .history-item .h-input{font-size:14px;color:var(--text2);margin-bottom:4px}
        .history-item .h-result{font-size:15px;font-weight:700;color:var(--text)}
        .history-item .h-date{font-size:11px;color:var(--text3);margin-top:4px}

        .theme-btn .icon-sun{display:none}
        .dark .theme-btn .icon-sun{display:inline}
        .dark .theme-btn .icon-moon{display:none}
    </style>
</head>
<body>
    <div class="container">
        <div class="top-row">
            <h1>Мультитул оператора</h1>
            <button class="theme-btn" onclick="toggleTheme()" title="Сменить тему">
                <span class="icon-moon">🌙</span>
                <span class="icon-sun">☀️</span>
            </button>
        </div>

        <div class="section-title" onclick="toggleSection('section1', this)">
            <span class="arrow" id="arrow1">▼</span>
            Короба в слое
        </div>
        <div class="collapsible expanded" id="section1">
            <div class="card">
                <label for="boxL">Длина коробки (см)</label>
                <input type="text" inputmode="decimal" id="boxL" placeholder="например, 40 или 12,5">
                <label for="boxW">Ширина коробки (см)</label>
                <input type="text" inputmode="decimal" id="boxW" placeholder="например, 26 или 12,5">
                <button class="btn" onclick="calc()">Рассчитать</button>
                <div class="error" id="err"></div>
            </div>
            <div class="card result" id="result">
                <div class="result-label">Коробов в слое</div>
                <div class="result-count" id="count">0</div>
                <div class="fill-row">
                    <span class="fill-key">Заполняемость</span>
                    <span class="fill-val" id="fill">0%</span>
                </div>
                <div class="dimensions" id="dims"></div>
                <div class="pallet-size">Паллета 120 × 80 см</pallet>
            </div>
        </div>

        <div class="section-title" onclick="toggleSection('section2', this)">
            <span class="arrow" id="arrow2">▼</span>
            Сроки годности
        </div>
        <div class="collapsible expanded" id="section2">
            <div class="card">
                <label>Дата производства</label>
                <div class="row3">
                    <div><select id="mfgDay"></select></div>
                    <div><select id="mfgMonth"></select></div>
                    <div><select id="mfgYear"></select></div>
                </div>

                <label for="shelfLife">Срок годности</label>
                <div class="row2">
                    <div><input type="text" inputmode="numeric" id="shelfLife" placeholder="Кол-во" maxlength="5"></div>
                    <div>
                        <select id="shelfUnit">
                            <option value="1">Сутки</option>
                            <option value="7">Недели</option>
                            <option value="30">Месяцы</option>
                            <option value="365">Годы</option>
                        </select>
                    </div>
                </div>

                <button class="btn" onclick="calcShelf()">Рассчитать</button>
                <div class="error" id="shelfErr"></div>
            </div>
            <div class="card result" id="shelfResult">
                <div class="result-label">Годен до</div>
                <div class="expiry-out" id="expiryDate"></div>
                <div class="left-out" id="daysLeft"></div>
            </div>
        </div>

        <div class="section-title" onclick="toggleSection('section3', this)">
            <span class="arrow" id="arrow3">▼</span>
            История
        </div>
        <div class="collapsible expanded" id="section3">
            <div class="card">
                <ul class="history-list" id="historyList"></ul>
                <button class="btn-sm" onclick="clearHistory()">Очистить историю</button>
            </div>
        </div>
    </div>

    <script>
        /* ===== Тема ===== */
        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem('darkTheme', document.body.classList.contains('dark') ? '1' : '0');
        }

        (function initTheme() {
            const saved = localStorage.getItem('darkTheme');
            if (saved === '1') document.body.classList.add('dark');
            else if (saved === '0') document.body.classList.remove('dark');
            else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
                document.body.classList.add('dark');
        })();

        /* ===== Сворачивание разделов с запоминанием ===== */
        const sectionIds = ['section1', 'section2', 'section3'];

        function restoreSections() {
            sectionIds.forEach((id, idx) => {
                const section = document.getElementById(id);
                const arrow = document.getElementById('arrow' + (idx + 1));
                const saved = localStorage.getItem('collapsed_' + id);
                if (saved === '1') {
                    section.classList.add('collapsed');
                    section.classList.remove('expanded');
                    arrow.classList.add('collapsed');
                } else {
                    section.classList.add('expanded');
                    section.classList.remove('collapsed');
                    arrow.classList.remove('collapsed');
                }
            });
        }

        function toggleSection(id, titleEl) {
            const section = document.getElementById(id);
            const arrow = titleEl.querySelector('.arrow');

            if (section.classList.contains('collapsed')) {
                section.classList.remove('collapsed');
                section.classList.remove('expanded');
                section.style.maxHeight = section.scrollHeight + 'px';
                arrow.classList.remove('collapsed');
                localStorage.setItem('collapsed_' + id, '0');

                section.addEventListener('transitionend', function onEnd(e) {
                    if (e.propertyName !== 'max-height') return;
                    section.style.maxHeight = 'none';
                    section.classList.add('expanded');
                    section.removeEventListener('transitionend', onEnd);
                });
            } else {
                section.classList.remove('expanded');
                section.style.maxHeight = section.scrollHeight + 'px';
                requestAnimationFrame(() => {
                    section.classList.add('collapsed');
                });
                arrow.classList.add('collapsed');
                localStorage.setItem('collapsed_' + id, '1');
            }
        }

        /* ===== История ===== */
        const HISTORY_KEY = 'history';
        const HISTORY_MAX = 10;
        let fromHistory = false;

        function getHistory() {
            try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
            catch { return []; }
        }

        function saveHistory(entry) {
            if (fromHistory) return;
            const h = getHistory();
            h.unshift(entry);
            if (h.length > HISTORY_MAX) h.length = HISTORY_MAX;
            localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
            renderHistory();
        }

        function renderHistory() {
            const h = getHistory();
            const ul = document.getElementById('historyList');
            ul.innerHTML = '';
            if (!h.length) {
                ul.innerHTML = '<li style="text-align:center;color:var(--text3);padding:16px">Пока пусто</li>';
                return;
            }
            h.forEach((e) => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div class="h-type">${e.type === 'boxes' ? 'Короба в слое' : 'Сроки годности'}</div>
                    <div class="h-input">${e.input}</div>
                    <div class="h-result">${e.result}</div>
                    <div class="h-date">${e.date}</div>
                `;
                li.onclick = () => restoreFromHistory(e);
                ul.appendChild(li);
            });
        }

        function restoreFromHistory(e) {
            fromHistory = true;
            if (e.type === 'boxes') {
                a.value = e.bl;
                b.value = e.bw;
                localStorage.setItem('bl', e.bl);
                localStorage.setItem('bw', e.bw);
                calc();
            } else {
                mfgDayEl.value = e.day;
                mfgMonthEl.value = e.month;
                mfgYearEl.value = e.year;
                updateDayLimit();
                mfgDayEl.value = e.day;
                document.getElementById("shelfLife").value = e.life;
                document.getElementById("shelfUnit").value = e.unit;
                localStorage.setItem('sDay', e.day);
                localStorage.setItem('sMonth', e.month);
                localStorage.setItem('sYear', e.year);
                localStorage.setItem('sLife', e.life);
                localStorage.setItem('sUnit', e.unit);
                calcShelf();
            }
            fromHistory = false;
        }

        function clearHistory() {
            if (confirm('Очистить историю?')) {
                localStorage.removeItem(HISTORY_KEY);
                renderHistory();
            }
        }

        /* ===== Блок 1: Короба ===== */
        const L = 120, W = 80;
        const a = document.getElementById("boxL");
        const b = document.getElementById("boxW");

        if (localStorage.getItem("bl")) a.value = localStorage.getItem("bl");
        if (localStorage.getItem("bw")) b.value = localStorage.getItem("bw");

        const num = v => parseFloat(String(v).trim().replace(',', '.'));
        const cnt = (zw, zh, bw, bh) => Math.floor(zw / bw) * Math.floor(zh / bh);

        function cuts(total, d1, d2) {
            const s = new Set();
            for (const d of [d1, d2]) {
                for (let k = 1; k * d < total; k++) {
                    s.add(+(k * d).toFixed(6));
                    s.add(+(total - k * d).toFixed(6));
                }
            }
            return [...s].filter(v => v > 0 && v < total).sort((x, y) => x - y);
        }

        function rowsBest(zw, zh, bl, bw) {
            const o = [{ w: bl, h: bw }, { w: bw, h: bl }];
            let best = 0;
            for (const r of o) best = Math.max(best, cnt(zw, zh, r.w, r.h));
            for (const ry of cuts(zh, bl, bw))
                for (const r1 of o) for (const r2 of o)
                    best = Math.max(best, cnt(zw, ry, r1.w, r1.h) + cnt(zw, zh - ry, r2.w, r2.h));
            for (const rx of cuts(zw, bl, bw))
                for (const r1 of o) for (const r2 of o)
                    best = Math.max(best, cnt(rx, zh, r1.w, r1.h) + cnt(zw - rx, zh, r2.w, r2.h));
            return best;
        }

        function best(bl, bw) {
            let best = 0;
            best = Math.max(best, rowsBest(L, W, bl, bw));
            for (const x of cuts(L, bl, bw))
                best = Math.max(best, rowsBest(x, W, bl, bw) + rowsBest(L - x, W, bl, bw));
            for (const y of cuts(W, bl, bw))
                best = Math.max(best, rowsBest(L, y, bl, bw) + rowsBest(L, W - y, bl, bw));
            for (const x of cuts(L, bl, bw))
                for (const y of cuts(W, bl, bw))
                    best = Math.max(best,
                        rowsBest(x, y, bl, bw) + rowsBest(L - x, y, bl, bw) +
                        rowsBest(x, W - y, bl, bw) + rowsBest(L - x, W - y, bl, bw));
            return best;
        }

        function showErr(msg) {
            document.getElementById("err").textContent = msg;
            document.getElementById("err").classList.add("show");
            document.getElementById("result").classList.remove("show");
        }

        function calc() {
            const bl = num(a.value), bw = num(b.value);
            a.classList.remove("err");
            b.classList.remove("err");
            document.getElementById("err").classList.remove("show");

            if (!isFinite(bl) || bl <= 0) {
                a.classList.add("err"); a.focus();
                showErr("7 раз отмерь — 1 раз введи");
                return;
            }
            if (!isFinite(bw) || bw <= 0) {
                b.classList.add("err"); b.focus();
                showErr("7 раз отмерь — 1 раз введи");
                return;
            }

            localStorage.setItem("bl", a.value);
            localStorage.setItem("bw", b.value);

            const total = best(bl, bw);
            if (!total) {
                a.classList.add("err");
                b.classList.add("err");
                showErr(`Коробка ${bl} × ${bw} см не влезает на паллету ${L} × ${W} см`);
                return;
            }

            document.getElementById("result").classList.add("show");
            document.getElementById("count").textContent = total;
            const fillPct = (total * bl * bw / (L * W) * 100).toFixed(1);
            document.getElementById("fill").textContent = fillPct + "%";
            document.getElementById("dims").textContent = `Коробка ${bl} × ${bw} см`;

            saveHistory({
                type: 'boxes',
                bl: a.value,
                bw: b.value,
                input: `Коробка ${bl} × ${bw} см`,
                result: `${total} шт. (${fillPct}%)`,
                date: new Date().toLocaleString('ru-RU')
            });
        }

        a.oninput = b.oninput = function () { this.classList.remove("err"); };
        a.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); b.focus(); } };
        b.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); calc(); } };

        /* ===== Блок 2: Сроки годности ===== */
        const mfgDayEl = document.getElementById("mfgDay");
        const mfgMonthEl = document.getElementById("mfgMonth");
        const mfgYearEl = document.getElementById("mfgYear");

        for (let i = 1; i <= 31; i++) {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = i;
            mfgDayEl.appendChild(opt);
        }

        const months = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
        months.forEach((name, idx) => {
            const opt = document.createElement("option");
            opt.value = idx + 1;
            opt.textContent = `${name} (${String(idx + 1).padStart(2, "0")})`;
            mfgMonthEl.appendChild(opt);
        });

        const curYear = new Date().getFullYear();
        for (let i = curYear; i >= curYear - 9; i--) {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = i;
            mfgYearEl.appendChild(opt);
        }

        function daysInMonth(m, y) {
            return new Date(y, m, 0).getDate();
        }

        function updateDayLimit() {
            const m = parseInt(mfgMonthEl.value) || 1;
            const y = parseInt(mfgYearEl.value) || curYear;
            const maxDay = daysInMonth(m, y);
            const prev = parseInt(mfgDayEl.value) || 1;
            mfgDayEl.innerHTML = "";
            for (let i = 1; i <= maxDay; i++) {
                const opt = document.createElement("option");
                opt.value = i;
                opt.textContent = i;
                mfgDayEl.appendChild(opt);
            }
            mfgDayEl.value = Math.min(prev, maxDay);
        }

        if (localStorage.getItem("sMonth")) mfgMonthEl.value = localStorage.getItem("sMonth");
        if (localStorage.getItem("sYear")) mfgYearEl.value = localStorage.getItem("sYear");
        updateDayLimit();
        if (localStorage.getItem("sDay")) mfgDayEl.value = localStorage.getItem("sDay");
        if (localStorage.getItem("sLife")) document.getElementById("shelfLife").value = localStorage.getItem("sLife");
        if (localStorage.getItem("sUnit")) document.getElementById("shelfUnit").value = localStorage.getItem("sUnit");

        mfgMonthEl.addEventListener("change", () => { updateDayLimit(); autoCalcShelf(); });
        mfgYearEl.addEventListener("change", () => { updateDayLimit(); autoCalcShelf(); });

        function pluralDays(n) {
            const a = n % 10, b = n % 100;
            if (a === 1 && b !== 11) return "день";
            if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "дня";
            return "дней";
        }

        function daysBetween(d1, d2) {
            const ms1 = Date.UTC(d1.getFullYear(), d1.getMonth(), d1.getDate());
            const ms2 = Date.UTC(d2.getFullYear(), d2.getMonth(), d2.getDate());
            return Math.round((ms2 - ms1) / (1000 * 60 * 60 * 24));
        }

        function fmtRemaining(fromDate, toDate) {
            let y = toDate.getFullYear() - fromDate.getFullYear();
            let m = toDate.getMonth() - fromDate.getMonth();
            let d = toDate.getDate() - fromDate.getDate();
            d -= 1;
            if (d < 0) { m--; const pm = new Date(toDate.getFullYear(), toDate.getMonth(), 0); d += pm.getDate(); }
            if (m < 0) { y--; m += 12; }
            const parts = [];
            if (y) parts.push(`${y} ${y === 1 ? "год" : (y >= 2 && y <= 4 ? "года" : "лет")}`);
            if (m) parts.push(`${m} ${m === 1 ? "месяц" : (m >= 2 && m <= 4 ? "месяца" : "месяцев")}`);
            if (d) parts.push(`${d} ${pluralDays(d)}`);
            if (!parts.length) parts.push("0 дней");
            return parts.join(" ");
        }

        function fmtOverdue(fromDate, toDate) {
            let y = toDate.getFullYear() - fromDate.getFullYear();
            let m = toDate.getMonth() - fromDate.getMonth();
            let d = toDate.getDate() - fromDate.getDate();
            if (d < 0) { m--; const pm = new Date(toDate.getFullYear(), toDate.getMonth(), 0); d += pm.getDate(); }
            if (m < 0) { y--; m += 12; }
            const parts = [];
            if (y) parts.push(`${y} ${y === 1 ? "год" : (y >= 2 && y <= 4 ? "года" : "лет")}`);
            if (m) parts.push(`${m} ${m === 1 ? "месяц" : (m >= 2 && m <= 4 ? "месяца" : "месяцев")}`);
            if (d) parts.push(`${d} ${pluralDays(d)}`);
            if (!parts.length) parts.push("0 дней");
            return parts.join(" ");
        }

        function calcShelf() {
            const d = parseInt(mfgDayEl.value);
            const m = parseInt(mfgMonthEl.value);
            const y = parseInt(mfgYearEl.value);
            const life = parseInt(document.getElementById("shelfLife").value);
            const unit = parseInt(document.getElementById("shelfUnit").value);

            const errEl = document.getElementById("shelfErr");
            errEl.classList.remove("show");

            if (!d || d < 1 || !m || m < 1 || m > 12 || !y || y < 2000 || y > 2100) {
                errEl.textContent = "Проверьте дату производства";
                errEl.classList.add("show");
                document.getElementById("shelfResult").classList.remove("show");
                return;
            }
            if (!life || life <= 0) {
                errEl.textContent = "Укажите срок годности";
                errEl.classList.add("show");
                document.getElementById("shelfResult").classList.remove("show");
                return;
            }

            const prodDate = new Date(y, m - 1, d);
            if (prodDate.getDate() !== d) {
                errEl.textContent = "Неверная дата (проверьте день)";
                errEl.classList.add("show");
                document.getElementById("shelfResult").classList.remove("show");
                return;
            }

            localStorage.setItem("sDay", mfgDayEl.value);
            localStorage.setItem("sMonth", mfgMonthEl.value);
            localStorage.setItem("sYear", mfgYearEl.value);
            localStorage.setItem("sLife", document.getElementById("shelfLife").value);
            localStorage.setItem("sUnit", unit);

            const expDate = new Date(y, m - 1, d);
            if (unit === 30) {
                expDate.setMonth(expDate.getMonth() + life);
            } else if (unit === 365) {
                expDate.setFullYear(expDate.getFullYear() + life);
            } else {
                expDate.setDate(expDate.getDate() + life * unit);
            }

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const pad = n => String(n).padStart(2, "0");
            const fmt = `${pad(expDate.getDate())}.${pad(expDate.getMonth() + 1)}.${expDate.getFullYear()}`;
            document.getElementById("expiryDate").textContent = fmt;

            const leftEl = document.getElementById("daysLeft");
            leftEl.className = "left-out";

            const totalDays = daysBetween(prodDate, expDate);
            const unitNames = {1:"Сутки",7:"Недели",30:"Месяцы",365:"Годы"};
            let resultStr = '';

            if (today.getTime() > expDate.getTime()) {
                resultStr = `Просрочено на ${fmtOverdue(expDate, today)}`;
                leftEl.textContent = resultStr;
                leftEl.classList.add("red");
            } else {
                const remaining = Math.max(0, daysBetween(today, expDate) - 1);
                const pct = totalDays > 0 ? Math.round(remaining / totalDays * 100) : 100;
                if (remaining <= 0) {
                    resultStr = `Осталось 0 дней (0%)`;
                    leftEl.textContent = resultStr;
                    leftEl.classList.add("orange");
                } else {
                    resultStr = `Осталось ${fmtRemaining(today, expDate)} (${pct}%)`;
                    leftEl.textContent = resultStr;
                    leftEl.classList.add(pct <= 20 ? "orange" : "green");
                }
            }

            document.getElementById("shelfResult").classList.add("show");

            saveHistory({
                type: 'shelf',
                day: mfgDayEl.value,
                month: mfgMonthEl.value,
                year: mfgYearEl.value,
                life: document.getElementById("shelfLife").value,
                unit: String(unit),
                input: `${pad(d)}.${pad(m)}.${y}, срок ${life} ${unitNames[unit] || ''}`,
                result: `Годен до ${fmt} — ${resultStr}`,
                date: new Date().toLocaleString('ru-RU')
            });
        }

        function autoCalcShelf() {
            if (mfgDayEl.value && mfgMonthEl.value && mfgYearEl.value && document.getElementById("shelfLife").value) {
                calcShelf();
            }
        }

        [mfgDayEl, document.getElementById("shelfUnit")].forEach(el => {
            el.onchange = autoCalcShelf;
        });

        document.getElementById("shelfLife").oninput = autoCalcShelf;

        ["boxL", "boxW", "shelfLife"].forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener("focus", function () {
                this.dataset.old = this.value;
                setTimeout(() => {
                    this.scrollIntoView({ behavior: "smooth", block: "center" });
                }, 300);
            });
            el.addEventListener("keydown", function (e) {
                const keys = ["Tab","Shift","Control","Alt","Backspace","Delete","ArrowLeft","ArrowRight","ArrowUp","ArrowDown"];
                if (!keys.includes(e.key) && this.dataset.old === this.value) {
                    this.value = "";
                    delete this.dataset.old;
                }
            });
        });

        document.getElementById("shelfLife").onkeydown = e => {
            if (e.key === "Enter") {
                e.preventDefault();
                calcShelf();
                document.getElementById("shelfLife").blur();
            }
        };

        /* ===== Загрузка ===== */
        restoreSections();
        renderHistory();
    </script>
</body>
</html>
