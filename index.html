<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коробов в слое</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;min-height:100vh;padding:16px}
        .container{max-width:600px;margin:0 auto}
        h1{text-align:center;font-size:22px;color:#1a1a2e;margin-bottom:20px}
        .card{background:#fff;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
        label{display:block;font-size:15px;color:#555;margin-bottom:6px;font-weight:500}
        input{width:100%;padding:14px;font-size:18px;border:2px solid #e0e0e0;border-radius:12px;outline:none;margin-bottom:16px}
        input:focus{border-color:#4a90d9}
        .btn{width:100%;padding:16px;font-size:18px;font-weight:600;color:#fff;background:#4a90d9;border:none;border-radius:12px;cursor:pointer}
        .btn:hover{background:#357abd}
        .result{display:none}
        .result.show{display:block}
        .result-count{text-align:center;font-size:48px;font-weight:700;color:#4a90d9}
        .result-label{text-align:center;font-size:16px;color:#888;margin-bottom:8px}
        .fill-row{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:8px}
        .fill-key{font-size:14px;color:#888}
        .fill-val{font-size:20px;font-weight:700;color:#2e7d32}
        .dimensions{text-align:center;font-size:13px;color:#888;margin-top:8px}
        .pallet-size{text-align:center;font-size:13px;color:#888;margin-top:4px}
        .error{color:#e74c3c;text-align:center;font-size:14px;margin-top:8px;display:none}
        .error.show{display:block}
    </style>
</head>
<body>
    <div class="container">
        <h1>Коробов в слое</h1>
        <div class="card">
            <label for="boxL">Длина коробки (см)</label>
            <input type="number" id="boxL" placeholder="например, 40" min="1" step="any">
            <label for="boxW">Ширина коробки (см)</label>
            <input type="number" id="boxW" placeholder="например, 26" min="1" step="any">
            <button class="btn" onclick="calculate()">Рассчитать</button>
            <div class="error" id="error"></div>
        </div>
        <div class="card result" id="result">
            <div class="result-label">Коробов в слое</div>
            <div class="result-count" id="count">0</div>
            <div class="fill-row">
                <span class="fill-key">Заполняемость</span>
                <span class="fill-val" id="fillPct">0%</span>
            </div>
            <div class="dimensions" id="dims"></div>
            <div class="pallet-size">Паллета 120 × 80 см</div>
        </div>
    </div>
    <script>
        const PL=120,PW=80;

        function cnt(zw,zh,bw,bh){return Math.floor(zw/bw)*Math.floor(zh/bh)}

        function findBest(bl,bw2){
            const o=[{w:bl,h:bw2},{w:bw2,h:bl}];
            let bc=0,bcfg=null;
            function t(c,cfg){if(c>bc){bc=c;bcfg=cfg}}
            for(let i=0;i<2;i++)
                t(cnt(PL,PW,o[i].w,o[i].h),{type:'s',o:[i]});
            for(let s=1;s<PL;s++)for(let i=0;i<2;i++)for(let j=0;j<2;j++)
                t(cnt(s,PW,o[i].w,o[i].h)+cnt(PL-s,PW,o[j].w,o[j].h),{type:'v2',s:[s],o:[i,j]});
            for(let s=1;s<PW;s++)for(let i=0;i<2;i++)for(let j=0;j<2;j++)
                t(cnt(PL,s,o[i].w,o[i].h)+cnt(PL,PW-s,o[j].w,o[j].h),{type:'h2',s:[s],o:[i,j]});
            for(let xs=1;xs<PL;xs++)for(let ys=1;ys<PW;ys())for(let i=0;i<2;i++)for(let j=0;j<2;j++)for(let k=0;k<2;k++)for(let l=0;l<2;l++)
                t(cnt(xs,ys,o[i].w,o[i].h)+cnt(PL-xs,ys,o[j].w,o[j].h)+cnt(xs,PW-ys,o[k].w,o[k].h)+cnt(PL-xs,PW-ys,o[l].w,o[l].h),{type:'x',s:[xs,ys],o:[i,j,k,l]});
            const tn={s:'Обычная',v2:'Смешанная (верт.)',h2:'Смешанная (гориз.)',x:'Смешанная'};
            return{total:bc,type:tn[bcfg.type]}
        }

        function calculate(){
            const bl=parseFloat(document.getElementById('boxL').value),
                  bw2=parseFloat(document.getElementById('boxW').value);
            if(!bl||!bw2||bl<=0||bw2<=0){err('Введите размеры коробки');return}
            const best=findBest(bl,bw2);
            if(!best.total){err('Коробка не помещается на паллету');return}
            document.getElementById('error').classList.remove('show');
            const r=document.getElementById('result');
            r.classList.add('show');
            document.getElementById('count').textContent=best.total;
            document.getElementById('fillPct').textContent=((best.total*bl*bw2)/(PL*PW)*100).toFixed(1)+'%';
            document.getElementById('dims').textContent='Коробка '+bl+' × '+bw2+' см';
            r.scrollIntoView({behavior:'smooth'})
        }

        function err(m){
            document.getElementById('error').textContent=m;
            document.getElementById('error').classList.add('show');
            document.getElementById('result').classList.remove('show')
        }

        document.getElementById('boxL').addEventListener('keydown',function(e){
            if(e.key==='Enter'){e.preventDefault();document.getElementById('boxW').focus()}
        });
        document.getElementById('boxW').addEventListener('keydown',function(e){
            if(e.key==='Enter'){e.preventDefault();calculate()}
        });
    </script>
</body>
</html>
