<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Мультитул оператора</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        :root{
            --bg:#f0f2f5; --card:#fff; --text:#1a1a2e; --text2:#555; --text3:#888;
            --accent:#4a90d9; --accent-hover:#357abd; --border:#e0e0e0; --err-bg:#fff0f0;
            --err-text:#e74c3c; --green:#2e7d32; --orange:#e67e22; --fill:#2e7d32;
            --result-text:#333; --input-bg:#fff; --input-text:#333; --tab-bg:#e8ecf1;
        }

        .dark{
            --bg:#1a1a2e; --card:#242440; --text:#e0e0e0; --text2:#aaa; --text3:#777;
            --accent:#5a9fe8; --accent-hover:#7ab3f0; --border:#3a3a5c; --err-bg:#3a1a1a;
            --err-text:#ff6b6b; --green:#4caf50; --orange:#ff9800; --fill:#4caf50;
            --result-text:#e0e0e0; --input-bg:#2a2a4a; --input-text:#e0e0e0; --tab-bg:#2a2a4a;
        }

        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:var(--bg);min-height:100vh;padding:16px;transition:background .3s ease;
        }
        .container{max-width:600px;margin:0 auto}

        .top-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;position:relative}
        h1{font-size:22px;color:var(--text);text-align:center}
        .theme-btn{
            position:absolute;right:0;top:50%;transform:translateY(-50%);
            background:none;border:none;font-size:24px;cursor:pointer;
            padding:4px 8px;border-radius:8px;
        }
        .theme-btn:hover{background:rgba(128,128,128,.2)}
        .theme-btn .icon-sun{display:none}
        .dark .theme-btn .icon-sun{display:inline}
        .dark .theme-btn .icon-moon{display:none}

        .section-title{
            text-align:center;font-size:18px;color:var(--accent);font-weight:700;
            margin:28px 0 16px;cursor:pointer;user-select:none;
            display:flex;align-items:center;justify-content:center;gap:10px;
        }
        .section-title .arrow{display:inline-block;transition:transform .2s ease;font-size:14px}
        .section-title .arrow.collapsed{transform:rotate(-90deg)}

        .collapsible{
            overflow:hidden;
            transition:max-height .3s ease,opacity .3s ease;
            max-height:var(--expand-max-height,10000px);
            opacity:1;
        }
        .collapsible.collapsed{
            max-height:0!important;
            opacity:0;
            pointer-events:none;
        }

        .card{
            background:var(--card);border-radius:16px;padding:24px;margin-bottom:16px;
            box-shadow:0 2px 12px rgba(0,0,0,.08);transition:background .3s ease;
        }

        label{display:block;font-size:15px;color:var(--text2);margin-bottom:6px;font-weight:500}
        input,select{
            width:100%;padding:14px;font-size:18px;border:2px solid var(--border);
            border-radius:12px;outline:none;margin-bottom:16px;scroll-margin-bottom:220px;
            background:var(--input-bg);color:var(--input-text);
            transition:background .3s ease,color .3s ease;
        }
        input:focus,select:focus{border-color:var(--accent)}
        input.err,textarea.err{border-color:var(--err-text);background:var(--err-bg)}
        textarea{
            width:100%;padding:14px;font-size:16px;border:2px solid var(--border);
            border-radius:12px;outline:none;margin-bottom:12px;min-height:80px;
            resize:vertical;scroll-margin-bottom:220px;
            background:var(--input-bg);color:var(--input-text);font-family:inherit;
            transition:background .3s ease,color .3s ease;
        }
        textarea:focus{border-color:var(--accent)}

        .btn{
            width:100%;padding:16px;font-size:18px;font-weight:600;color:#fff;
            background:var(--accent);border:none;border-radius:12px;cursor:pointer;
            transition:background .3s ease;
        }
        .btn:hover{background:var(--accent-hover)}
        .btn-sm{
            width:auto;padding:10px 20px;font-size:14px;font-weight:600;
            color:var(--err-text);background:none;border:2px solid var(--err-text);
            border-radius:10px;cursor:pointer;margin:12px auto 0;display:block;
        }
        .btn-sm:hover{background:var(--err-bg)}

        .result{display:none}
        .result.show{display:block}
        .result-label{text-align:center;font-size:16px;color:var(--text3);margin-bottom:8px}
        .result-count{text-align:center;font-size:48px;font-weight:700;color:var(--accent)}
        .fill-row{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:8px}
        .fill-key{font-size:14px;color:var(--text3)}
        .fill-val{font-size:20px;font-weight:700;color:var(--fill)}
        .dimensions{text-align:center;font-size:13px;color:var(--text3);margin-top:8px}
        .pallet-size{text-align:center;font-size:13px;color:var(--text3);margin-top:4px}
        .error{color:var(--err-text);text-align:center;font-size:15px;font-weight:600;margin-top:12px;display:none}
        .error.show{display:block}

        .row3{display:flex;gap:10px}
        .row3>div{flex:1}
        .row2{display:flex;gap:10px}
        .row2>div{flex:1}

        .expiry-out{text-align:center;font-size:22px;font-weight:700;color:var(--result-text);margin-bottom:12px}
        .left-out{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
        .left-out.red{color:var(--err-text)}
        .left-out.green{color:var(--green)}
        .left-out.orange{color:var(--orange)}

        .history-tabs{display:flex;gap:8px;margin-bottom:16px}
        .history-tab{
            flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;
            color:var(--text2);background:var(--tab-bg);border:2px solid transparent;
            border-radius:10px;cursor:pointer;transition:all .2s ease;user-select:none;
        }
        .history-tab.active{color:var(--accent);border-color:var(--accent);background:var(--card)}

        .history-list{list-style:none}
        .history-item{
            background:var(--card);border:1px solid var(--border);border-radius:12px;
            padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s ease;
        }
        .history-item:hover{border-color:var(--accent)}
        .h-input{font-size:14px;color:var(--text2);margin-bottom:4px;word-break:break-all}
        .h-result{font-size:15px;font-weight:700;color:var(--text)}
        .h-date{font-size:11px;color:var(--text3);margin-top:4px}

        .prefix-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;user-select:none}
        .prefix-row input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
        .prefix-row label{margin:0;font-size:15px;cursor:pointer}
        .prefix-input-wrap{display:none;margin-bottom:16px}
        .prefix-input-wrap.show{display:block}

        .code-grid{
            display:flex;
            flex-wrap:wrap;
            gap:16px;
            margin-top:16px;
            justify-content:center;
            overflow-x:auto;
        }

        .code-item{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            background:#fff;
            border-radius:12px;
            padding:16px;
            flex: 0 0 calc(33.333% - 11px);
            min-width:180px;
            cursor:pointer;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
            transition:all .2s ease;
        }

        .code-item:hover{
            box-shadow:0 4px 16px rgba(0,0,0,.15);
            transform:translateY(-2px);
        }

        .code-item canvas,
        .modal-qr canvas{
            image-rendering:pixelated;
            width:100%;
            height:auto;
            display:block;
            border:2px solid var(--border);
            border-radius:8px;
            background:#fff;
        }

        .code-item .code-text{
            font-size:11px;
            color:#555;
            max-width:100%;
            word-break:break-all;
            text-align:center;
            line-height:1.3;
            overflow:hidden;
            text-overflow:ellipsis;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
            font-weight:500;
        }

        .download-row{
            display:flex;justify-content:center;align-items:center;gap:12px;
            margin:12px 0;flex-wrap:wrap;
        }

        .btn-download-icon{
            font-size:24px;cursor:pointer;transition:transform .2s ease;
            padding:8px 12px;
            background:var(--accent);
            color:#fff;
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:center;
            border:none;
        }
        .btn-download-icon:hover{transform:scale(1.1)}

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal{
            display:none;
            position:fixed;
            z-index:1000;
            left:0;
            top:0;
            width:100%;
            height:100%;
            background-color:rgba(0,0,0,.7);
            animation:fadeIn .2s ease;
        }

        .modal.show{display:flex}

        @keyframes fadeIn{
            from{opacity:0}
            to{opacity:1}
        }

        .modal-content{
            background:var(--card);
            margin:auto;
            padding:30px;
            border-radius:16px;
            max-width:90%;
            max-height:90vh;
            overflow:auto;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:20px;
            box-shadow:0 4px 20px rgba(0,0,0,.3);
            animation:slideIn .2s ease;
        }

        @keyframes slideIn{
            from{
                transform:translateY(-50px);
                opacity:0;
            }
            to{
                transform:translateY(0);
                opacity:1;
            }
        }

        .modal-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            width:100%;
            gap:16px;
        }

        .modal-close{
            background:none;
            border:none;
            font-size:28px;
            cursor:pointer;
            color:var(--text);
            padding:0;
            width:40px;
            height:40px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:8px;
            transition:background .2s ease;
        }

        .modal-close:hover{
            background:var(--err-bg);
            color:var(--err-text);
        }

        .modal-qr{
            width:100%;
            max-width:400px;
            display:flex;
            justify-content:center;
        }

        .modal-text{
            font-size:16px;
            color:var(--text);
            text-align:center;
            word-break:break-all;
            max-width:100%;
            padding:12px;
            background:var(--tab-bg);
            border-radius:8px;
            width:100%;
        }

        .modal-buttons{
            display:flex;
            gap:12px;
            width:100%;
            flex-wrap:wrap;
            justify-content:center;
        }

        .modal-btn{
            flex:1;
            min-width:120px;
            padding:12px 20px;
            font-size:14px;
            font-weight:600;
            border:none;
            border-radius:8px;
            cursor:pointer;
            transition:all .2s ease;
        }

        .modal-btn-copy{
            background:var(--accent);
            color:#fff;
        }

        .modal-btn-copy:hover{
            background:var(--accent-hover);
        }

        .modal-btn-download{
            background:var(--green);
            color:#fff;
        }

        .modal-btn-download:hover{
            background:#1e5620;
        }

        .modal-btn-close{
            background:var(--err-bg);
            color:var(--err-text);
        }

        .modal-btn-close:hover{
            background:var(--err-text);
            color:#fff;
        }

        .copy-notify{
            position:fixed;
            bottom:20px;
            left:50%;
            transform:translateX(-50%);
            background:var(--green);
            color:#fff;
            padding:12px 24px;
            border-radius:8px;
            font-weight:600;
            animation:slideUp .3s ease;
            z-index:2000;
        }

        @keyframes slideUp{
            from{
                transform:translateX(-50%) translateY(100px);
                opacity:0;
            }
            to{
                transform:translateX(-50%) translateY(0);
                opacity:1;
            }
        }

        @media (max-width: 900px) {
            .code-item { flex: 0 0 calc(50% - 8px); }
        }
        @media (max-width: 600px) {
            .code-item { flex: 0 0 calc(100% - 0px); }
            .modal-content{
                max-width:95%;
                padding:20px;
            }
        }
    </style>
</head>
<body>

<!-- ✅ FIX #11: noscript для отключённого JS -->
<noscript>
    <div style="text-align:center;padding:40px;color:#e74c3c;font-size:18px">
        ⚠️ Для работы приложения требуется JavaScript
    </div>
</noscript>

<div class="container">
    <div class="top-row">
        <h1>Мультитул оператора</h1>
        <button class="theme-btn" onclick="App.toggleTheme()" title="Сменить тему">
            <span class="icon-moon">🌙</span>
            <span class="icon-sun">☀️</span>
        </button>
    </div>

    <!-- КОРОБА -->
    <!-- ✅ FIX #7: aria-expanded -->
    <div class="section-title" onclick="App.toggleSection(this)" aria-expanded="true" role="button" tabindex="0">
        <span class="arrow">▼</span>Короба в слое
    </div>
    <div class="collapsible expanded" id="section1">
        <div class="card">
            <label for="boxL">Длина коробки (см)</label>
            <input type="text" inputmode="decimal" id="boxL" placeholder="например, 40 или 12,5">
            <label for="boxW">Ширина коробки (см)</label>
            <input type="text" inputmode="decimal" id="boxW" placeholder="например, 26 или 12,5">
            <button class="btn" onclick="App.calc()">Рассчитать</button>
            <div class="error" id="err"></div>
        </div>
        <!-- ✅ FIX #13: aria-live для озвучки результата -->
        <div class="card result" id="result" aria-live="polite">
            <div class="result-label">Коробок в слое</div>
            <div class="result-count" id="count">0</div>
            <div class="fill-row">
                <span class="fill-key">Заполняемость</span>
                <span class="fill-val" id="fill">0%</span>
            </div>
            <div class="dimensions" id="dims"></div>
            <div class="pallet-size">Паллета 120 × 80 см</div>
        </div>
    </div>

    <!-- СРОКИ ГОДНОСТИ -->
    <div class="section-title" onclick="App.toggleSection(this)" aria-expanded="true" role="button" tabindex="0">
        <span class="arrow">▼</span>Сроки годности
    </div>
    <div class="collapsible expanded" id="section2">
        <div class="card">
            <label>Дата производства</label>
            <div class="row3">
                <div><select id="mfgDay" aria-label="День"></select></div>
                <div><select id="mfgMonth" aria-label="Месяц"></select></div>
                <div><select id="mfgYear" aria-label="Год"></select></div>
            </div>
            <label for="shelfLife">Срок годности</label>
            <div class="row2">
                <div><input type="text" inputmode="numeric" id="shelfLife" placeholder="Кол-во" maxlength="5"></div>
                <div>
                    <select id="shelfUnit">
                        <option value="1">Сутки</option>
                        <option value="7">Недели</option>
                        <option value="30">Месяцы</option>
                        <option value="365">Годы</option>
                    </select>
                </div>
            </div>
            <button class="btn" onclick="App.calcShelf()">Рассчитать</button>
            <div class="error" id="shelfErr"></div>
        </div>
        <!-- ✅ FIX #13 -->
        <div class="card result" id="shelfResult" aria-live="polite">
            <div class="result-label">Годен до</div>
            <div class="expiry-out" id="expiryDate"></div>
            <div class="left-out" id="daysLeft"></div>
        </div>
    </div>

    <!-- ГЕНЕРАТОР QR -->
    <div class="section-title" onclick="App.toggleSection(this)" aria-expanded="true" role="button" tabindex="0">
        <span class="arrow">▼</span>Генератор QR-кодов
    </div>
    <div class="collapsible expanded" id="section3">
        <div class="card">
            <label for="codeInput">Текст (через пробел — отдельные коды)</label>
            <textarea id="codeInput" placeholder="Вставьте текст..."></textarea>

            <!-- ✅ FIX #2: исправлен баг с чекбоксом -->
            <div class="prefix-row" onclick="App.onPrefixRowClick(event)">
                <input type="checkbox" id="prefixCheck" onclick="event.stopPropagation();App.togglePrefixInput()">
                <label>Добавить текст в конец каждой строки</label>
            </div>
            <div class="prefix-input-wrap" id="prefixWrap">
                <label for="prefixVal">Текст</label>
                <input type="text" id="prefixVal">
            </div>

            <button class="btn" onclick="App.generateCode()">Сгенерировать</button>
            <div class="error" id="codeErr"></div>
        </div>
        <!-- ✅ FIX #13 -->
        <div class="card result" id="codeResult" aria-live="polite">
            <div class="download-row">
                <div class="result-label" id="codeResultLabel" style="flex:1;margin:0">QR-коды (0 шт.)</div>
                <button class="btn-download-icon" title="Скачать все PNG" onclick="App.downloadAllPNG()">⤓</button>
            </div>
            <div class="code-grid" id="codeGrid"></div>
        </div>
    </div>

    <!-- ИСТОРИЯ -->
    <div class="section-title" onclick="App.toggleSection(this)" aria-expanded="true" role="button" tabindex="0">
        <span class="arrow">▼</span>История
    </div>
    <div class="collapsible expanded" id="section4">
        <div class="card">
            <!-- ✅ FIX #7: role для табов -->
            <div class="history-tabs" role="tablist">
                <div class="history-tab active" id="tabBoxes" role="tab" aria-selected="true" onclick="App.switchHistoryTab('boxes')">Короба</div>
                <div class="history-tab" id="tabShelf" role="tab" aria-selected="false" onclick="App.switchHistoryTab('shelf')">Сроки</div>
                <div class="history-tab" id="tabCode" role="tab" aria-selected="false" onclick="App.switchHistoryTab('code')">QR-коды</div>
            </div>
            <ul class="history-list" id="historyList"></ul>
            <button class="btn-sm" onclick="App.clearHistory()">Очистить историю</button>
        </div>
    </div>
</div>

<!-- ===== МОДАЛЬНОЕ ОКНО ДЛЯ QR ===== -->
<!-- ✅ FIX #7: role="dialog", aria-modal -->
<div id="qrModal" class="modal" role="dialog" aria-modal="true" aria-label="QR-код" onclick="App.closeQRModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2 style="color:var(--text);margin:0">QR-код</h2>
            <button class="modal-close" onclick="App.closeQRModal()">✕</button>
        </div>
        <div class="modal-qr">
            <canvas id="modalCanvas"></canvas>
        </div>
        <div class="modal-text" id="modalText"></div>
        <div class="modal-buttons">
            <button class="modal-btn modal-btn-copy" onclick="App.copyToClipboard()">📋 Копировать</button>
            <button class="modal-btn modal-btn-download" onclick="App.downloadSingleQR()">⤓ Скачать</button>
            <button class="modal-btn modal-btn-close" onclick="App.closeQRModal()">Закрыть</button>
        </div>
    </div>
</div>

<!-- ===== QR БИБЛИОТЕКА ===== -->
<script>
var qrcode = (function() {
    'use strict';

    var EXP = new Array(512), LOG = new Array(256);
    (function() {
        var x = 1;
        for (var i = 0; i < 255; i++) {
            EXP[i] = x;
            LOG[x] = i;
            x <<= 1;
            if (x & 0x100) x ^= 0x11D;
        }
        for (var i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
    })();

    function gfMul(a, b) {
        if (!a || !b) return 0;
        return EXP[LOG[a] + LOG[b]];
    }

    function rsGenPoly(degree) {
        var poly = [1];
        for (var i = 0; i < degree; i++) {
            var next = [];
            for (var k = 0; k <= poly.length; k++) next.push(0);
            for (var j = 0; j < poly.length; j++) {
                next[j + 1] ^= poly[j];
                next[j] ^= gfMul(poly[j], EXP[i]);
            }
            poly = next;
        }
        return poly.reverse();
    }

    function rsEncode(data, ecLen) {
        var gen = rsGenPoly(ecLen);
        var buf = data.slice();
        for (var i = 0; i < ecLen; i++) buf.push(0);
        for (var i = 0; i < data.length; i++) {
            var coef = buf[i];
            if (coef) {
                for (var j = 0; j < gen.length; j++)
                    buf[i + j] ^= gfMul(gen[j], coef);
            }
        }
        return buf.slice(data.length);
    }

    var RST = [
        [1,26,19],[1,26,16],[1,26,13],[1,26,9],
        [1,44,34],[1,44,28],[1,44,22],[1,44,16],
        [1,70,55],[1,70,44],[2,35,17],[2,35,13],
        [1,100,80],[2,50,32],[2,50,24],[4,25,9],
        [1,134,108],[2,67,43],[2,67,33],[2,67,17],
        [2,86,68],[4,43,27],[4,43,21],[4,43,12],
        [2,98,78],[4,49,31],[2,49,24,2,50,25],[4,31,14,1,32,15],
        [2,121,97],[2,60,38,2,61,39],[4,58,31,2,59,32],[4,38,18,2,39,19],
        [2,152,116],[3,58,36,2,59,37],[4,69,36,4,70,37],[4,36,16,2,37,17],
        [2,86,68,2,87,69],[4,69,43,1,70,44],[6,43,19,2,44,20],[6,43,19,1,44,20],
        [2,98,78,2,99,79],[1,80,50,4,81,51],[4,81,43,4,82,44],[3,45,20,7,46,21],

            for (var j = 0; j < entry[i]; j++) {

    function BB() { this.buf = []; this.len = 0; }
    BB.prototype.put = function(v, n) {
        for (var i = n - 1; i >= 0; i--) this.putBit((v >>> i) & 1);
    };
    BB.prototype.putBit = function(b) {
        var idx = Math.floor(this.len / 8);
        if (this.buf.length <= idx) this.buf.push(0);
        if (b) this.buf[idx] |= (0x80 >>> (this.len % 8));

            else if (c < 0x800) out.push(0xC0|(c>>6), 0x80|(c&0x3F));

        return ((data << 10) | d) ^ 0x5412;

                    }

            probe(0,0); probe(mc-7,0); probe(0,mc-7);

            for (var i = 0; i < pos.length; i++) for (var j = 0; j < pos.length; j++) {
                var row = pos[i], col = pos[j];

                for (var r = -2; r <= 2; r++) for (var c = -2; c <= 2; c++)
                    m[row+r][col+c] = (r==-2||r==2||c==-2||c==2||(r==0&&c==0));
            }

            for (var r = 8; r < mc-8; r++) if (m[r][6]==null) m[r][6] = (r%2==0);
            for (var c = 8; c < mc-8; c++) if (m[6][c]==null) m[6][c] = (c%2==0);

            m[mc-8][8] = true;

            var fi = bchTI((ecVal << 3) | mask);
            for (var i = 0; i < 15; i++) {
                var mod = ((fi >> i) & 1) == 1;
                if (i < 6) m[i][8] = mod;
                else if (i < 8) m[i+1][8] = mod;
                else m[mc-15+i][8] = mod;
            }
            for (var i = 0; i < 15; i++) {
                var mod = ((fi >> i) & 1) == 1;
                if (i < 8) m[8][mc-i-1] = mod;
                else if (i < 9) m[8][15-i-1+1] = mod;
                else m[8][15-i-1] = mod;
            }

            if (ver >= 7) {
                var vn = bchTN(ver);
                for (var i = 0; i < 18; i++) {
                    var mod = ((vn >> i) & 1) == 1;
                    m[Math.floor(i/3)][i%3+mc-8-3] = mod;
                }
                for (var i = 0; i < 18; i++) {
                    var mod = ((vn >> i) & 1) == 1;

                }

            var inc = -1, row = mc-1, bitIdx = 7, byteIdx = 0;
            for (var col = mc-1; col > 0; col -= 2) {

        }

        var final = makeMat(bestMask);
        return {
            getModuleCount: function() { return mc; },
            isDark: function(r, c) { return !!final[r][c]; }

    }

        render: function(canvas, text, ecLevel, scale) {

            // ✅ FIX #9: именованная константа вместо магического числа

    }

    function loadSectionStates() {
        var saved = storageGet('sectionStates');
        if (saved) {
            try {
                var parsed = JSON.parse(saved);
                // ✅ FIX: валидируем загруженный объект
                if (parsed && typeof parsed === 'object') {
                    sectionStates = parsed;
                }
                ['section1', 'section2', 'section3', 'section4'].forEach(function(sectionId) {
                    var section = document.getElementById(sectionId);
                    if (!section) return;
                    var titleEl = section.previousElementSibling;
                    var arrow = titleEl ? titleEl.querySelector('.arrow') : null;

                    if (sectionStates[sectionId]) {
                        section.classList.remove('collapsed');
                        section.style.maxHeight = '';
                        if (arrow) arrow.classList.remove('collapsed');
                        if (titleEl) titleEl.setAttribute('aria-expanded', 'true');
                    } else {
                        section.classList.add('collapsed');
                        section.style.maxHeight = '0px';
                        if (arrow) arrow.classList.add('collapsed');
                        if (titleEl) titleEl.setAttribute('aria-expanded', 'false');
                    }
                });
            } catch (e) {}
        }
    }

    // ===== КАЛЬКУЛЯТОР 1: КОРОБА =====

    function nBoxes(zw, zh, bw, bh) {
        return Math.floor(zw / bw) * Math.floor(zh / bh);
    }

    function points(total, d1, d2) {
        var s = {}, o = [];
        for (var k = 1; k * d1 <= total; k++) s[k * d1] = 1;
        for (var k = 1; k * d2 <= total; k++) s[k * d2] = 1;
        for (var k = 0; k * d1 < total; k++) s[total - k * d1] = 1;
        for (var k = 0; k * d2 < total; k++) s[total - k * d2] = 1;
        for (var p in s) {
            var v = +p;
            if (v > 0 && v < total) o.push(v);
        }
        return o.sort(function(a, b) { return a - b; });
    }

    function bestArrangement(bl, bw) {
        var cacheKey = bl + '_' + bw;
        var cached = cacheGet(cacheKey);
        if (cached) return cached;

        var orientations = [
            { w: bl, h: bw },
            { w: bw, h: bl }
        ];
        var bestCount = 0, bestConfig = null;

        function updateBest(count, config) {
            if (count > bestCount) {
                bestCount = count;
                bestConfig = config;
            }
        }

        for (var i = 0; i < 2; i++) {
            updateBest(nBoxes(PALLET_L, PALLET_W, orientations[i].w, orientations[i].h), { type: 'simple' });
        }

        // ✅ FIX #4: заменён for...of на forEach (ES5-совместимость)
        var xPoints = points(PALLET_L, bl, bw);
        var yPoints = points(PALLET_W, bl, bw);

        xPoints.forEach(function(s) {
            for (var i = 0; i < 2; i++) {
                for (var j = 0; j < 2; j++) {
                    var count = nBoxes(s, PALLET_W, orientations[i].w, orientations[i].h) +
                                nBoxes(PALLET_L - s, PALLET_W, orientations[j].w, orientations[j].h);
                    updateBest(count, { type: 'vert' });
                }
            }
        });

        yPoints.forEach(function(s) {
            for (var i = 0; i < 2; i++) {
                for (var j = 0; j < 2; j++) {
                    var count = nBoxes(PALLET_L, s, orientations[i].w, orientations[i].h) +
                                nBoxes(PALLET_L, PALLET_W - s, orientations[j].w, orientations[j].h);
                    updateBest(count, { type: 'horiz' });
                }
            }
        });

        xPoints.forEach(function(xs) {
            yPoints.forEach(function(ys) {
                for (var i = 0; i < 2; i++) {
                    for (var j = 0; j < 2; j++) {
                        for (var k = 0; k < 2; k++) {
                            for (var l = 0; l < 2; l++) {
                                var count = nBoxes(xs, ys, orientations[i].w, orientations[i].h) +
                                           nBoxes(PALLET_L - xs, ys, orientations[j].w, orientations[j].h) +
                                           nBoxes(xs, PALLET_W - ys, orientations[k].w, orientations[k].h) +
                                           nBoxes(PALLET_L - xs, PALLET_W - ys, orientations[l].w, orientations[l].h);
                                updateBest(count, { type: 'combined' });
                            }
                        }
                    }
                }
            });
        });

        var typeNames = {
            simple: 'Обычная',
            vert: 'Смешанная (верт.)',
            horiz: 'Смешанная (гориз.)',
            combined: 'Смешанная'
        };

        var result = {
            total: bestCount,
            type: typeNames[bestConfig ? bestConfig.type : 'simple']
        };

        cacheSet(cacheKey, result);
        return result;
    }

    function calc() {
        var bl = parseNum(DOM.boxL.value);
        var bw = parseNum(DOM.boxW.value);

        clearErrors('boxes');

        // ✅ FIX #6: проверка диапазона, а не просто <= 0
        if (isNaN(bl) || bl < 1 || bl > PALLET_L) {
            showError('boxes', 'Длина коробки: от 1 до ' + PALLET_L + ' см', DOM.boxL);
            DOM.result.classList.remove('show');
            return;
        }
        if (isNaN(bw) || bw < 1 || bw > PALLET_W) {
            showError('boxes', 'Ширина коробки: от 1 до ' + PALLET_W + ' см', DOM.boxW);
            DOM.result.classList.remove('show');
            return;
        }

        var arrangement = bestArrangement(bl, bw);
        if (!arrangement.total) {
            showError('boxes', 'Не удалось рассчитать — коробка не помещается', DOM.boxL);
            DOM.result.classList.remove('show');
            return;
        }

        var totalFormatted = fmtNumber(arrangement.total);
        var fillPct = ((arrangement.total * bl * bw) / (PALLET_L * PALLET_W) * 100).toFixed(1);

        DOM.count.textContent = totalFormatted;
        DOM.fill.textContent = fillPct + '%';
        DOM.dims.textContent = 'Коробка ' + bl + ' × ' + bw + ' см · ' + arrangement.type;
        DOM.result.classList.add('show');
        DOM.result.scrollIntoView({ behavior: 'smooth' });

        if (!skipHistorySave) {
            saveToHistory('boxes', bl + ' × ' + bw, totalFormatted + ' шт.', { bl: bl, bw: bw });
        }
    }

    // ===== КАЛЬКУЛЯТОР 2: СРОКИ ГОДНОСТИ =====

    function initShelfSelects() {
        DOM.mfgDay.innerHTML = '<option value="">День</option>';
        for (var i = 1; i <= 31; i++) {
            DOM.mfgDay.innerHTML += '<option value="' + i + '">' + i + '</option>';
        }

        DOM.mfgMonth.innerHTML = '<option value="">Месяц</option>';
        for (var i = 0; i < 12; i++) {
            DOM.mfgMonth.innerHTML += '<option value="' + (i + 1) + '">' + MONTHS[i] + '</option>';
        }

        DOM.mfgYear.innerHTML = '<option value="">Год</option>';
        var now = new Date();
        for (var i = now.getFullYear(); i > now.getFullYear() - 10; i--) {
            DOM.mfgYear.innerHTML += '<option value="' + i + '">' + i + '</option>';
        }
    }

    function isValidDate(d, m, y) {
        var test = new Date(y, m - 1, d);
        return test.getDate() === d && test.getMonth() === m - 1 && test.getFullYear() === y;
    }

    function calcShelf() {
        var d = +DOM.mfgDay.value;
        var m = +DOM.mfgMonth.value;
        var y = +DOM.mfgYear.value;
        var qty = parseInt(DOM.shelfLife.value);
        var unit = +DOM.shelfUnit.value;

        clearErrors('shelf');

        if (!d || !m || !y) {
            showError('shelf', 'Укажите дату производства');
            DOM.shelfResult.classList.remove('show');
            return;
        }
        if (!isValidDate(d, m, y)) {
            showError('shelf', 'Неверная дата');
            DOM.shelfResult.classList.remove('show');
            return;
        }
        if (!qty || qty <= 0) {
            showError('shelf', 'Укажите срок годности');
            DOM.shelfResult.classList.remove('show');
            return;
        }

        var mfg = new Date(y, m - 1, d);
        var exp = new Date(mfg);

        if (unit === 30) exp.setMonth(exp.getMonth() + qty);
        else if (unit === 365) exp.setFullYear(exp.getFullYear() + qty);
        else exp.setDate(exp.getDate() + qty * unit);

        var ed = exp.getDate(), em = exp.getMonth() + 1, ey = exp.getFullYear();
        var expDateStr = pad(ed) + '.' + pad(em) + '.' + ey;
        DOM.expiryDate.textContent = expDateStr;

        var now = new Date();
        var daysLeft = Math.ceil((exp - now) / (1000 * 60 * 60 * 24));

        if (daysLeft < 0) {
            DOM.daysLeft.textContent = 'Истёк на ' + (-daysLeft) + ' дн.';
            DOM.daysLeft.className = 'left-out red';
        } else if (daysLeft <= DAYS_ORANGE_THRESHOLD) {
            DOM.daysLeft.textContent = daysLeft + ' дн. до истечения';
            DOM.daysLeft.className = 'left-out orange';
        } else {
            DOM.daysLeft.textContent = daysLeft + ' дн. осталось';
            DOM.daysLeft.className = 'left-out green';
        }

        DOM.shelfResult.classList.add('show');
        DOM.shelfResult.scrollIntoView({ behavior: 'smooth' });

        if (!skipHistorySave) {
            saveToHistory('shelf', pad(d) + '.' + pad(m) + '.' + y + ' / ' + qty + ' ' + DOM.shelfUnit.selectedOptions[0].text.toLowerCase(), expDateStr, {
                d: d, m: m, y: y, qty: qty, unit: unit
            });
        }
    }

    // ===== КАЛЬКУЛЯТОР 3: QR-КОДЫ =====

    // ✅ FIX #2: исправлен баг с чекбоксом — обработка клика по строке
    function onPrefixRowClick(event) {
        if (event.target === DOM.prefixCheck) return;
        DOM.prefixCheck.click();
        togglePrefixInput();
    }

    // ✅ FIX #2: togglePrefixInput больше не переключает checked вручную
    function togglePrefixInput() {
        if (DOM.prefixCheck.checked) {
            DOM.prefixWrap.classList.add('show');
            DOM.prefixVal.focus();
        } else {
            DOM.prefixWrap.classList.remove('show');
        }
    }

    function generateCode() {
        var text = DOM.codeInput.value.trim();
        var prefix = DOM.prefixVal.value;
        var usePrefix = DOM.prefixCheck.checked;

        clearErrors('code');

        if (!text) {
            showError('code', 'Введите текст');
            DOM.codeResult.classList.remove('show');
            return;
        }

        var lines = text.split(/[\s\n]+/).filter(function(line) { return line.length > 0; });

        if (!lines.length) {
            showError('code', 'Введите текст');
            DOM.codeResult.classList.remove('show');
            return;
        }

        DOM.codeGrid.innerHTML = '';
        var codes = [];

        for (var i = 0; i < lines.length; i++) {
            var codeText = lines[i];
            if (usePrefix && prefix) {
                codeText += prefix;
            }

            var canvas = document.createElement('canvas');
            try {
                qrcode.render(canvas, codeText, 'M', QR_SCALE);
            } catch (e) {
                showError('code', 'Ошибка QR для «' + codeText.substring(0, 30) + '»: ' + e.message);
                DOM.codeResult.classList.remove('show');
                return;
            }

            var codeItem = document.createElement('div');
            codeItem.className = 'code-item';
            codeItem.setAttribute('tabindex', '0');
            codeItem.setAttribute('role', 'button');
            codeItem.appendChild(canvas);

            // ✅ FIX #1: безопасная вставка через textContent
            var textEl = document.createElement('div');
            textEl.className = 'code-text';
            textEl.textContent = codeText;
            codeItem.appendChild(textEl);

            codeItem.onclick = (function(cd) {
                return function() { openQRModal(cd); };
            })({ canvas: canvas, text: codeText });

            // ✅ FIX #7: keyboard support
            codeItem.onkeydown = (function(cd) {
                return function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openQRModal(cd);
                    }
                };
            })({ canvas: canvas, text: codeText });

            DOM.codeGrid.appendChild(codeItem);
            codes.push({ canvas: canvas, text: codeText });
        }

        DOM.codeResultLabel.textContent = 'QR-коды (' + codes.length + ' шт.)';
        DOM.codeResult.classList.add('show');
        DOM.codeResult.scrollIntoView({ behavior: 'smooth' });

        if (!skipHistorySave) {
            saveToHistory('code', text.substring(0, 50) + (text.length > 50 ? '...' : ''), codes.length + ' шт.', {
                text: text,
                prefix: prefix,
                usePrefix: usePrefix
            });
        }
    }

    // ✅ FIX #3: загрузка с задержкой, чтобы браузер не блокировал
    function downloadAllPNG() {
        var canvases = DOM.codeGrid.querySelectorAll('canvas');
        if (!canvases.length) return;

        var idx = 0;
        function downloadNext() {
            if (idx >= canvases.length) return;
            var canvas = canvases[idx];
            var link = document.createElement('a');
            link.href = canvas.toDataURL('image/png');
            link.download = 'qr_' + (idx + 1) + '.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            idx++;
            if (idx < canvases.length) {
                setTimeout(downloadNext, DOWNLOAD_DELAY_MS);
            }
        }
        downloadNext();
        showNotification('Загрузка ' + canvases.length + ' файлов...');
    }

    // ===== МОДАЛЬНОЕ ОКНО =====

    function openQRModal(codeData) {
        currentQRData = codeData;
        var sourceCanvas = codeData.canvas;
        DOM.modalCanvas.width = sourceCanvas.width;
        DOM.modalCanvas.height = sourceCanvas.height;
        var ctx = DOM.modalCanvas.getContext('2d');
        ctx.drawImage(sourceCanvas, 0, 0);

        DOM.modalText.textContent = codeData.text;
        DOM.qrModal.classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeQRModal(event) {
        if (event && event.target !== DOM.qrModal) return;
        DOM.qrModal.classList.remove('show');
        document.body.style.overflow = '';
        currentQRData = null;
    }

    function copyToClipboard() {
        if (!currentQRData) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(currentQRData.text).then(function() {
                showNotification('Скопировано в буфер обмена');
            }).catch(function() {
                fallbackCopy(currentQRData.text);
            });
        } else {
            fallbackCopy(currentQRData.text);
        }
    }

    // ✅ FIX: fallback для браузеров без Clipboard API
    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            showNotification('Скопировано в буфер обмена');
        } catch (e) {
            showNotification('Не удалось скопировать');
        }
        document.body.removeChild(ta);
    }

    function downloadSingleQR() {
        if (!currentQRData) return;
        var link = document.createElement('a');
        link.href = DOM.modalCanvas.toDataURL('image/png');
        link.download = 'qr_' + new Date().getTime() + '.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function showNotification(msg) {
        var notif = document.createElement('div');
        notif.className = 'copy-notify';
        notif.setAttribute('role', 'status');
        notif.textContent = msg;
        document.body.appendChild(notif);
        setTimeout(function() {
            notif.remove();
        }, 2000);
    }

    // ===== ИСТОРИЯ =====

    function saveToHistory(type, input, result, data) {
        try {
            var raw = storageGet('appHistory');
            var history;
            try {
                history = JSON.parse(raw || '{}');
            } catch (e) {
                history = {};
            }
            // ✅ FIX: валидируем структуру истории
            if (!history.boxes) history.boxes = [];
            if (!history.shelf) history.shelf = [];
            if (!history.code) history.code = [];
            if (!Array.isArray(history[type])) history[type] = [];

            var entry = {
                input: String(input),
                result: String(result),
                timestamp: new Date().toLocaleString('ru-RU'),
                data: data
            };
            history[type].unshift(entry);
            if (history[type].length > HISTORY_MAX) history[type].length = HISTORY_MAX;
            storageSet('appHistory', JSON.stringify(history));
            renderHistory(type);
        } catch (e) {
            console.warn('Не удалось сохранить в историю:', e);
        }
    }

    // ✅ FIX #1: рендер истории через DOM API (без innerHTML с пользовательскими данными)
    function renderHistory(type) {
        try {
            var raw = storageGet('appHistory');
            var history;
            try {
                history = JSON.parse(raw || '{}');
            } catch (e) {
                history = {};
            }

            var entries = (history[type] && Array.isArray(history[type])) ? history[type] : [];
            DOM.historyList.innerHTML = '';

            if (!entries.length) {
                var emptyLi = document.createElement('li');
                emptyLi.style.textAlign = 'center';
                emptyLi.style.color = 'var(--text3)';
                emptyLi.textContent = 'История пуста';
                DOM.historyList.appendChild(emptyLi);
                return;
            }

            for (var i = 0; i < entries.length; i++) {
                var entry = entries[i];
                var li = document.createElement('li');
                li.className = 'history-item';
                li.setAttribute('tabindex', '0');

                // Безопасная вставка — только textContent
                var divInput = document.createElement('div');
                divInput.className = 'h-input';
                divInput.textContent = entry.input || '';

                var divResult = document.createElement('div');
                divResult.className = 'h-result';
                divResult.textContent = entry.result || '';

                var divDate = document.createElement('div');
                divDate.className = 'h-date';
                divDate.textContent = entry.timestamp || '';

                li.appendChild(divInput);
                li.appendChild(divResult);
                li.appendChild(divDate);

                li.onclick = (function(histType, histData) {
                    return function() {
                        loadFromHistory(histType, histData);
                    };
                })(type, entry.data);

                li.onkeydown = (function(histType, histData) {
                    return function(e) {
                        if (e.key === 'Enter') loadFromHistory(histType, histData);
                    };
                })(type, entry.data);

                DOM.historyList.appendChild(li);
            }
        } catch (e) {
            console.warn('Не удалось отрисовать историю:', e);
        }
    }

    function switchHistoryTab(type) {
        [DOM.tabBoxes, DOM.tabShelf, DOM.tabCode].forEach(function(tab) {
            tab.classList.remove('active');
            tab.setAttribute('aria-selected', 'false');
        });

        if (type === 'boxes') { DOM.tabBoxes.classList.add('active'); DOM.tabBoxes.setAttribute('aria-selected', 'true'); }
        else if (type === 'shelf') { DOM.tabShelf.classList.add('active'); DOM.tabShelf.setAttribute('aria-selected', 'true'); }
        else if (type === 'code') { DOM.tabCode.classList.add('active'); DOM.tabCode.setAttribute('aria-selected', 'true'); }

        renderHistory(type);
    }

    function loadFromHistory(type, data) {
        if (!data) return;
        skipHistorySave = true;

        if (type === 'boxes') {
            DOM.boxL.value = data.bl;
            DOM.boxW.value = data.bw;
            expandSection('section1');
            setTimeout(function() {
                calc();
                skipHistorySave = false;
            }, 100);
        } else if (type === 'shelf') {
            DOM.mfgDay.value = data.d;
            DOM.mfgMonth.value = data.m;
            DOM.mfgYear.value = data.y;
            DOM.shelfLife.value = data.qty;
            DOM.shelfUnit.value = data.unit;
            expandSection('section2');
            setTimeout(function() {
                calcShelf();
                skipHistorySave = false;
            }, 100);
        } else if (type === 'code') {
            DOM.codeInput.value = data.text;
            DOM.prefixCheck.checked = !!data.usePrefix;
            DOM.prefixVal.value = data.prefix || '';
            if (data.usePrefix) DOM.prefixWrap.classList.add('show');
            else DOM.prefixWrap.classList.remove('show');
            expandSection('section3');
            setTimeout(function() {
                generateCode();
                skipHistorySave = false;
            }, 100);
        }
    }

    function expandSection(sectionId) {
        var section = document.getElementById(sectionId);
        if (!section) return;

        if (section.classList.contains('collapsed')) {
            section.style.maxHeight = section.scrollHeight + 'px';
            section.classList.remove('collapsed');
            var titleEl = section.previousElementSibling;
            var arrow = titleEl ? titleEl.querySelector('.arrow') : null;
            if (arrow) arrow.classList.remove('collapsed');
            if (titleEl) titleEl.setAttribute('aria-expanded', 'true');
            sectionStates[sectionId] = true;
            saveSectionStates();
        }
    }

    function clearHistory() {
        if (confirm('Вы уверены? Это действие нельзя отменить.')) {
            storageSet('appHistory', JSON.stringify({ boxes: [], shelf: [], code: [] }));
            renderHistory('boxes');
            showNotification('История очищена');
        }
    }

    // ===== СОХРАНЕНИЕ ПОЛЕЙ ВВОДА =====

    // ✅ FIX #5: сохранение полей ввода с debounce
    var saveFieldsTimer = null;

    function saveAllFields() {
        var fields = ['boxL', 'boxW', 'codeInput', 'prefixVal', 'shelfLife'];
        fields.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) storageSet('mt_field_' + id, el.value);
        });
        storageSet('mt_field_shelfDay', DOM.mfgDay ? DOM.mfgDay.value : '');
        storageSet('mt_field_shelfMonth', DOM.mfgMonth ? DOM.mfgMonth.value : '');
        storageSet('mt_field_shelfYear', DOM.mfgYear ? DOM.mfgYear.value : '');
        storageSet('mt_field_shelfUnit', DOM.shelfUnit ? DOM.shelfUnit.value : '');
    }

    function scheduleSaveFields() {
        clearTimeout(saveFieldsTimer);
        saveFieldsTimer = setTimeout(saveAllFields, SAVE_FIELDS_DEBOUNCE);
    }

    function restoreFields() {
        var fields = ['boxL', 'boxW', 'codeInput', 'prefixVal', 'shelfLife'];
        fields.forEach(function(id) {
            var el = document.getElementById(id);
            if (el) {
                var saved = storageGet('mt_field_' + id);
                if (saved !== null) el.value = saved;
            }
        });
        var sd = storageGet('mt_field_shelfDay');
        if (sd !== null) DOM.mfgDay.value = sd;
        var sm = storageGet('mt_field_shelfMonth');
        if (sm !== null) DOM.mfgMonth.value = sm;
        var sy = storageGet('mt_field_shelfYear');
        if (sy !== null) DOM.mfgYear.value = sy;
        var su = storageGet('mt_field_shelfUnit');
        if (su !== null) DOM.shelfUnit.value = su;

        // Восстанавливаем prefixWrap
        if (DOM.prefixCheck.checked) DOM.prefixWrap.classList.add('show');
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====

    function init() {
        initDOM();
        initTheme();
        initShelfSelects();
        loadSectionStates();
        restoreFields();
        renderHistory('boxes');

        // ✅ FIX #5: слушатель сохранения полей
        document.addEventListener('input', scheduleSaveFields);
        document.addEventListener('change', scheduleSaveFields);

        // ✅ FIX #12: keydown перенесён в init
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && DOM.qrModal && DOM.qrModal.classList.contains('show')) {
                closeQRModal();
            }
        });

        // ✅ FIX #7: keyboard для заголовков секций
        document.querySelectorAll('.section-title').forEach(function(el) {
            el.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleSection(el);
                }
            });
        });
    }

    // ===== PUBLIC API =====

    return {
        toggleTheme: toggleTheme,
        toggleSection: toggleSection,
        calc: calc,
        calcShelf: calcShelf,
        onPrefixRowClick: onPrefixRowClick,
        togglePrefixInput: togglePrefixInput,
        generateCode: generateCode,

        closeQRModal: closeQRModal,
        copyToClipboard: copyToClipboard,
        downloadSingleQR: downloadSingleQR,
        switchHistoryTab: switchHistoryTab,
        clearHistory: clearHistory,
        init: init
    };
})();

document.addEventListener('DOMContentLoaded', function() {
    App.init();
});
