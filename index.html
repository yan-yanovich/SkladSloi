<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мультитул оператора</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;min-height:100vh;padding:16px}
        .container{max-width:600px;margin:0 auto}
        h1{text-align:center;font-size:22px;color:#1a1a2e;margin-bottom:20px}
        .section-title{text-align:center;font-size:18px;color:#4a90d9;font-weight:700;margin:28px 0 16px}
        .card{background:#fff;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
        label{display:block;font-size:15px;color:#555;margin-bottom:6px;font-weight:500}
        input{width:100%;padding:14px;font-size:18px;border:2px solid #e0e0e0;border-radius:12px;outline:none;margin-bottom:16px}
        input:focus{border-color:#4a90d9}
        input.err{border-color:#e74c3c;background:#fff0f0}
        select{width:100%;padding:14px;font-size:18px;border:2px solid #e0e0e0;border-radius:12px;outline:none;margin-bottom:16px;background:#fff}
        select:focus{border-color:#4a90d9}
        .btn{width:100%;padding:16px;font-size:18px;font-weight:600;color:#fff;background:#4a90d9;border:none;border-radius:12px;cursor:pointer}
        .btn:hover{background:#357abd}
        .result{display:none}.result.show{display:block}
        .result-label{text-align:center;font-size:16px;color:#888;margin-bottom:8px}
        .result-count{text-align:center;font-size:48px;font-weight:700;color:#4a90d9}
        .fill-row{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:8px}
        .fill-key{font-size:14px;color:#888}
        .fill-val{font-size:20px;font-weight:700;color:#2e7d32}
        .dimensions{text-align:center;font-size:13px;color:#888;margin-top:8px}
        .pallet-size{text-align:center;font-size:13px;color:#888;margin-top:4px}
        .error{color:#e74c3c;text-align:center;font-size:15px;font-weight:600;margin-top:12px;display:none}
        .error.show{display:block}
        .row3{display:flex;gap:10px}
        .row3>div{flex:1}
        .row3 input{margin-bottom:16px}
        .row2{display:flex;gap:10px}
        .row2>div{flex:1}
        .row2 select,.row2 input{margin-bottom:16px}
        .expiry-out{text-align:center;font-size:22px;font-weight:700;color:#333;margin-bottom:12px}
        .left-out{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
        .left-out.red{color:#e74c3c}
        .left-out.green{color:#2e7d32}
        .left-out.orange{color:#e67e22}
    </style>
</head>
<body>
    <div class="container">
        <h1>Мультитул оператора</h1>

        <!-- ===== БЛОК 1: Короба в слое ===== -->
        <div class="section-title">Короба в слое</div>
        <div class="card">
            <label for="boxL">Длина коробки (см)</label>
            <input type="text" inputmode="decimal" id="boxL" placeholder="например, 40 или 12,5">
            <label for="boxW">Ширина коробки (см)</label>
            <input type="text" inputmode="decimal" id="boxW" placeholder="например, 26 или 12,5">
            <button class="btn" onclick="calc()">Рассчитать</button>
            <div class="error" id="err"></div>
        </div>
        <div class="card result" id="result">
            <div class="result-label">Коробов в слое</div>
            <div class="result-count" id="count">0</div>
            <div class="fill-row">
                <span class="fill-key">Заполняемость</span>
                <span class="fill-val" id="fill">0%</span>
            </div>
            <div class="dimensions" id="dims"></div>
            <div class="pallet-size">Паллета 120 × 80 см</div>
        </div>

        <!-- ===== БЛОК 2: Сроки годности ===== -->
        <div class="section-title">Сроки годности</div>
        <div class="card">
            <label>Дата производства</label>
            <div class="row3">
                <div>
                    <input type="text" inputmode="numeric" id="mfgDay" placeholder="День" maxlength="2">
                </div>
                <div>
                    <input type="text" inputmode="numeric" id="mfgMonth" placeholder="Месяц" maxlength="2">
                </div>
                <div>
                    <input type="text" inputmode="numeric" id="mfgYear" placeholder="Год" maxlength="4">
                </div>
            </div>

            <label for="shelfLife">Срок годности</label>
            <div class="row2">
                <div>
                    <input type="text" inputmode="numeric" id="shelfLife" placeholder="Кол-во" maxlength="5">
                </div>
                <div>
                    <select id="shelfUnit">
                        <option value="1">Сутки</option>
                        <option value="7">Недели</option>
                        <option value="30">Месяцы</option>
                        <option value="365">Годы</option>
                    </select>
                </div>
            </div>

            <button class="btn" onclick="calcShelf()">Рассчитать</button>
            <div class="error" id="shelfErr"></div>
        </div>
        <div class="card result" id="shelfResult">
            <div class="result-label">Годен до</div>
            <div class="expiry-out" id="expiryDate"></div>
            <div class="left-out" id="daysLeft"></div>
        </div>
    </div>

    <script>
        /* ===== Блок 1: Короба ===== */
        const L = 120, W = 80;
        const a = document.getElementById("boxL");
        const b = document.getElementById("boxW");

        if (localStorage.getItem("bl")) a.value = localStorage.getItem("bl");
        if (localStorage.getItem("bw")) b.value = localStorage.getItem("bw");

        const num = v => parseFloat(String(v).trim().replace(',', '.'));
        const cnt = (zw, zh, bw, bh) => Math.floor(zw / bw) * Math.floor(zh / bh);

        function cuts(total, d1, d2) {
            const s = new Set();
            for (const d of [d1, d2]) {
                for (let k = 1; k * d < total; k++) {
                    s.add(+(k * d).toFixed(6));
                    s.add(+(total - k * d).toFixed(6));
                }
            }
            return [...s].filter(v => v > 0 && v < total).sort((x, y) => x - y);
        }

        function rowsBest(zw, zh, bl, bw) {
            const o = [{ w: bl, h: bw }, { w: bw, h: bl }];
            let best = 0;
            for (const r of o) best = Math.max(best, cnt(zw, zh, r.w, r.h));
            for (const ry of cuts(zh, bl, bw))
                for (const r1 of o) for (const r2 of o)
                    best = Math.max(best, cnt(zw, ry, r1.w, r1.h) + cnt(zw, zh - ry, r2.w, r2.h));
            for (const rx of cuts(zw, bl, bw))
                for (const r1 of o) for (const r2 of o)
                    best = Math.max(best, cnt(rx, zh, r1.w, r1.h) + cnt(zw - rx, zh, r2.w, r2.h));
            return best;
        }

        function best(bl, bw) {
            let best = 0;
            best = Math.max(best, rowsBest(L, W, bl, bw));
            for (const x of cuts(L, bl, bw))
                best = Math.max(best, rowsBest(x, W, bl, bw) + rowsBest(L - x, W, bl, bw));
            for (const y of cuts(W, bl, bw))
                best = Math.max(best, rowsBest(L, y, bl, bw) + rowsBest(L, W - y, bl, bw));
            for (const x of cuts(L, bl, bw))
                for (const y of cuts(W, bl, bw))
                    best = Math.max(best,
                        rowsBest(x, y, bl, bw) + rowsBest(L - x, y, bl, bw) +
                        rowsBest(x, W - y, bl, bw) + rowsBest(L - x, W - y, bl, bw));
            return best;
        }

        function showErr(msg) {
            document.getElementById("err").textContent = msg;
            document.getElementById("err").classList.add("show");
            document.getElementById("result").classList.remove("show");
        }

        function calc() {
            const bl = num(a.value), bw = num(b.value);
            a.classList.remove("err");
            b.classList.remove("err");
            document.getElementById("err").classList.remove("show");

            if (!isFinite(bl) || bl <= 0) {
                a.classList.add("err"); a.focus();
                showErr("7 раз отмерь — 1 раз введи");
                return;
            }
            if (!isFinite(bw) || bw <= 0) {
                b.classList.add("err"); b.focus();
                showErr("7 раз отмерь — 1 раз введи");
                return;
            }

            localStorage.setItem("bl", a.value);
            localStorage.setItem("bw", b.value);

            const total = best(bl, bw);
            if (!total) {
                a.classList.add("err");
                b.classList.add("err");
                showErr(`Коробка ${bl} × ${bw} см не влезает на паллету ${L} × ${W} см`);
                return;
            }

            document.getElementById("result").classList.add("show");
            document.getElementById("count").textContent = total;
            document.getElementById("fill").textContent =
                (total * bl * bw / (L * W) * 100).toFixed(1) + "%";
            document.getElementById("dims").textContent = `Коробка ${bl} × ${bw} см`;
        }

        a.oninput = b.oninput = function () { this.classList.remove("err"); };
        a.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); b.focus(); } };
        b.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); calc(); } };

        /* ===== Блок 2: Сроки годности ===== */

        if (localStorage.getItem("sDay")) document.getElementById("mfgDay").value = localStorage.getItem("sDay");
        if (localStorage.getItem("sMonth")) document.getElementById("mfgMonth").value = localStorage.getItem("sMonth");
        if (localStorage.getItem("sYear")) document.getElementById("mfgYear").value = localStorage.getItem("sYear");
        if (localStorage.getItem("sLife")) document.getElementById("shelfLife").value = localStorage.getItem("sLife");
        if (localStorage.getItem("sUnit")) document.getElementById("shelfUnit").value = localStorage.getItem("sUnit");

        function pluralDays(n) {
            const a = n % 10, b = n % 100;
            if (a === 1 && b !== 11) return "день";
            if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return "дня";
            return "дней";
        }

        function fmtParts(totalDays) {
            const years = Math.floor(totalDays / 365);
            let rest = totalDays % 365;
            const months = Math.floor(rest / 30);
            const days = rest % 30;
            const parts = [];
            if (years) parts.push(`${years} ${years === 1 ? "год" : (years >= 2 && years <= 4 ? "года" : "лет")}`);
            if (months) parts.push(`${months} ${months === 1 ? "месяц" : (months >= 2 && months <= 4 ? "месяца" : "месяцев")}`);
            if (days) parts.push(`${days} ${pluralDays(days)}`);
            if (!parts.length) parts.push("0 дней");
            return parts.join(" ");
        }

        function calcShelf() {
            const d = parseInt(document.getElementById("mfgDay").value);
            const m = parseInt(document.getElementById("mfgMonth").value);
            const y = parseInt(document.getElementById("mfgYear").value);
            const life = parseInt(document.getElementById("shelfLife").value);
            const unit = parseInt(document.getElementById("shelfUnit").value);

            const errEl = document.getElementById("shelfErr");
            errEl.classList.remove("show");

            if (!d || d < 1 || d > 31 || !m || m < 1 || m > 12 || !y || y < 2000 || y > 2100) {
                errEl.textContent = "Проверьте дату производства";
                errEl.classList.add("show");
                document.getElementById("shelfResult").classList.remove("show");
                return;
            }
            if (!life || life <= 0) {
                errEl.textContent = "Укажите срок годности";
                errEl.classList.add("show");
                document.getElementById("shelfResult").classList.remove("show");
                return;
            }

            const prodDate = new Date(y, m - 1, d);
            if (prodDate.getDate() !== d) {
                errEl.textContent = "Неверная дата (проверьте день)";
                errEl.classList.add("show");
                document.getElementById("shelfResult").classList.remove("show");
                return;
            }

            localStorage.setItem("sDay", document.getElementById("mfgDay").value);
            localStorage.setItem("sMonth", document.getElementById("mfgMonth").value);
            localStorage.setItem("sYear", document.getElementById("mfgYear").value);
            localStorage.setItem("sLife", document.getElementById("shelfLife").value);
            localStorage.setItem("sUnit", unit);

            // Срок годности в днях, но день производства и день окончания НЕ считаются
            // => добавляем life*unit дней к дате производства, потом Годен до = prodDate + totalDays
            const totalDays = life * unit;
            const expDate = new Date(prodDate);
            expDate.setDate(expDate.getDate() + totalDays);

            // Остаток считаем от сегодня до expDate (не включая день окончания)
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Дни между датами: считаем интервал, исключая оба граничных дня
            // Между prodDate и expDate без учёта граничных = totalDays - 1 + ... 
            // Проще: интервал от prodDate до expDate = totalDays дней.
            // Но по условию день производства и день окончания не считаются.
            // Значит «живой» период = totalDays - 1 дней между ними.
            // Для расчёта остатка от сегодня: считаем сколько дней от today до expDate
            // (не включая today и expDate).
            // diffDays = разница в днях между датами (expDate - today).
            // Если today < expDate: осталось = diffDays - 1 (не считаем today и expDate).
            // Но это сложно и нелогично для пользователя.
            //
            // Упростим: «день производства и день окончания не считаются» = 
            // срока годности N дней означает что продукт годен N-1 дней 
            // (день 2 ... день N-1 от производства).
            //
            // Годен до = prodDate + totalDays (дата после которой уже НЕ годен).
            // Годный период: с prodDate+1 по expDate-1 = totalDays - 1 дней.
            //
            // Остаток от сегодня: количество дней от today до expDate-1 включительно.
            // = (expDate - today) / день  - 1 ... нет.
            //
            // Проще всего: осталось дней = количество дней до истечения.
            // Если today = expDate, то сегодня последний НЕ годный день -> истекло.
            // Если today = expDate - 1, то остался 1 день.
            //
            // Осталось = expDate - today (в днях).
            // Если 0 -> истекает сегодня / просрочено.
            // Если < 0 -> просрочено на |diff|.
            //
            // Но по условию день окончания не считается, значит:
            // Годен до (не включительно) = prodDate + totalDays.
            // Осталось дней годности = max(0, expDate - today) ... hmm.
            //
            // Возьмём простой подход:
            // Годный период: totalDays дней ПОСЛЕ дня производства, но день окончания не годный.
            // Значит годных дней = totalDays - 1 (со 2-го по totalDays-й день после производства).
            // Годен до = prodDate + totalDays (дата, начиная с которой НЕ годен).
            //
            // Осталось годных дней от today = expDate - today (без учёта сегодняшнего).
            // Если today = prodDate: осталось totalDays - 1 (т.к. today не считается).
            // Если today = prodDate + 1: осталось totalDays - 2.
            // Если today = expDate - 1: осталось 1.
            // Если today = expDate: осталось 0 -> истёк.
            //
            // Значит осталось = (expDate - today) в днях.
            // Просрочено = today - expDate в днях.
            //
            // Но это при том что и today не считается.
            //
            // Принимаем: осталось = diffDays (expDate - today), просрочено = -diffDays.

            const diffMs = expDate.getTime() - today.getTime();
            const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

            const pad = n => String(n).padStart(2, "0");
            const fmt = `${pad(expDate.getDate())}/${pad(expDate.getMonth() + 1)}/${expDate.getFullYear()}`;

            document.getElementById("expiryDate").textContent = fmt;

            const leftEl = document.getElementById("daysLeft");
            leftEl.className = "left-out";

            if (diffDays <= 0) {
                leftEl.textContent = `Просрочено на ${fmtParts(-diffDays || 1)}`;
                leftEl.classList.add("red");
            } else {
                const pct = Math.round(diffDays / totalDays * 100);
                leftEl.textContent = `Осталось ${fmtParts(diffDays)} (${pct}%)`;
                leftEl.classList.add("green");
            }

            document.getElementById("shelfResult").classList.add("show");
        }

        ["mfgDay", "mfgMonth", "mfgYear", "shelfLife"].forEach(id => {
            document.getElementById(id).onkeydown = e => {
                if (e.key === "Enter") { e.preventDefault(); calcShelf(); }
            };
        });
    </script>
</body>
</html>
