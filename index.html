<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор укладки на паллету</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            color: #1a1a2e;
            margin-bottom: 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-size: 15px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #4a90d9;
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background: #4a90d9;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #357abd;
        }

        .result {
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-count {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            color: #4a90d9;
        }

        .result-label {
            text-align: center;
            font-size: 16px;
            color: #888;
            margin-bottom: 16px;
        }

        .pallet-wrapper {
            position: relative;
            background: #8B6914;
            border-radius: 2px;
            margin: 20px 0;
            width: 100%;
            padding-bottom: 66.67%;
        }

        .pallet-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: grid;
            gap: 0;
        }

        .box-cell {
            background: #f5e6c8;
            border: 1px solid #c4953a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #8B6914;
            overflow: hidden;
        }

        .dimensions {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-top: 8px;
        }

        .pallet-label {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-top: 8px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-key {
            color: #888;
        }

        .info-val {
            font-weight: 600;
            color: #333;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Укладка на паллету</h1>

        <div class="card">
            <div class="info-row">
                <span class="info-key">Паллета</span>
                <span class="info-val">120 × 80 см</span>
            </div>
        </div>

        <div class="card">
            <label for="boxL">Длина коробки (см)</label>
            <input type="number" id="boxL" placeholder="например, 30" min="1" step="any">

            <label for="boxW">Ширина коробки (см)</label>
            <input type="number" id="boxW" placeholder="например, 16" min="1" step="any">

            <button class="btn" onclick="calculate()">Рассчитать</button>
            <div class="error" id="error"></div>
        </div>

        <div class="card result" id="result">
            <div class="result-label">Коробок в слое</div>
            <div class="result-count" id="count">0</div>
            <div class="dimensions" id="dims"></div>

            <div class="pallet-wrapper">
                <div class="pallet-grid" id="pallet"></div>
            </div>

            <div class="pallet-label">
                <span id="palletInfo"></span>
            </div>
        </div>
    </div>

    <script>
        const PALLET_L = 120;
        const PALLET_W = 80;

        function calculate() {
            const boxL = parseFloat(document.getElementById('boxL').value);
            const boxW = parseFloat(document.getElementById('boxW').value);

            if (!boxL || !boxW || boxL <= 0 || boxW <= 0) {
                showError('Введите размеры коробки');
                return;
            }

            // Собираем варианты: только те, где коробка хотя бы 1 раз влезает
            const variants = [];

            // Вариант 1: boxL вдоль 120, boxW вдоль 80
            const cols1 = Math.floor(PALLET_L / boxL);
            const rows1 = Math.floor(PALLET_W / boxW);
            const total1 = cols1 * rows1;
            if (cols1 >= 1 && rows1 >= 1) {
                variants.push({ total: total1, cols: cols1, rows: rows1, dimX: boxL, dimY: boxW });
            }

            // Вариант 2 (поворот): boxW вдоль 120, boxL вдоль 80
            const cols2 = Math.floor(PALLET_L / boxW);
            const rows2 = Math.floor(PALLET_W / boxL);
            const total2 = cols2 * rows2;
            if (cols2 >= 1 && rows2 >= 1) {
                variants.push({ total: total2, cols: cols2, rows: rows2, dimX: boxW, dimY: boxL });
            }

            if (variants.length === 0) {
                showError('Коробка не помещается на паллету ни в одной ориентации');
                return;
            }

            // Берём лучший вариант
            const best = variants.reduce((a, b) => a.total >= b.total ? a : b);

            // Показать результат
            document.getElementById('result').classList.add('show');
            document.getElementById('count').textContent = best.total;
            document.getElementById('dims').textContent =
                `${best.dimX} см (по длине) × ${best.dimY} см (по ширине)`;

            // Схема — пропорциональная, без отступов
            const pallet = document.getElementById('pallet');
            pallet.style.gridTemplateColumns = `repeat(${best.cols}, 1fr)`;
            pallet.style.gridTemplateRows = `repeat(${best.rows}, 1fr)`;
            pallet.innerHTML = '';

            for (let i = 1; i <= best.total; i++) {
                const div = document.createElement('div');
                div.className = 'box-cell';
                div.textContent = i;
                pallet.appendChild(div);
            }

            document.getElementById('palletInfo').textContent =
                `Паллета ${PALLET_L} × ${PALLET_W} см · ${best.cols} × ${best.rows}`;

            document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
        }

        function showError(msg) {
            document.getElementById('error').textContent = msg;
            document.getElementById('error').classList.add('show');
            document.getElementById('result').classList.remove('show');
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') calculate();
        });
    </script>
</body>
</html>
