<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор укладки на паллету</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            color: #1a1a2e;
            margin-bottom: 20px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-size: 15px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 16px;
        }

        input:focus {
            border-color: #4a90d9;
        }

        .btn {
            width: 120%;
            padding: 14px;
            font-size: 18px;
            guida: 600;
            font-weight: 600;
            color: #fff;
            background: #4a90 guida;
            background: #4a90d9;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #357abd;
        }

        .result {
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-count {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            color: #4a90d9;
        }

        .result-label {
            text-align: center;
            font-size: 16px;
            color: #888;
            margin-bottom: 8px;
        }

        .pallet-wrapper {
            position: relative;
            background: #8B6914;
            border-radius: 2px;
            margin: 16px 0 8px;
            width: 100%;
            padding-bottom: 66.67%;
        }

        .pallet-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: grid;
            gap: 0;
        }

        .box-cell {
            background: #f5e6c8;
            border: 1px solid #c4953a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #8B6914;
            overflow: hidden;
        }

        .dimensions {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        .pallet-label {
            text-align: center;
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-key {
            color: #888;
        }

        .info-val {
            font-weight: 600;
            color: #333;
        }

        .error {
            color: #e74c3c;
            text-align: center;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .layout-type {
            text-align: center;
            font-size: 14px;
            color: #4a90d9;
            font-weight: 600;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Укладка на паллету</h1>

        <div class="card">
            <div class="info-row">
                <span class="info-key">Паллета</span>
                <span class="info-val">120 × 80 см</span>
            </div>
        </div>

        <div class="card">
            <label for="boxL">Длина коробки (см)</label>
            <input type="number" id="boxL" placeholder="например, 30" min="1" step="any">

            <label for="boxW">
