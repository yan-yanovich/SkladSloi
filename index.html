<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коробов в слое</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;min-height:100vh;padding:16px}
        .container{max-width:600px;margin:0 auto}
        h1{text-align:center;font-size:22px;color:#1a1a2e;margin-bottom:20px}
        .card{background:#fff;border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
        label{display:block;font-size:15px;color:#555;margin-bottom:6px;font-weight:500}
        input{width:100%;padding:14px;font-size:18px;border:2px solid #e0e0e0;border-radius:12px;outline:none;margin-bottom:16px}
        input:focus{border-color:#4a90d9}
        input.err{border-color:#e74c3c;background:#fff0f0}
        .btn{width:100%;padding:16px;font-size:18px;font-weight:600;color:#fff;background:#4a90d9;border:none;border-radius:12px;cursor:pointer}
        .btn:hover{background:#357abd}
        .result{display:none}
        .result.show{display:block}
        .result-count{text-align:center;font-size:48px;font-weight:700;color:#4a90d9}
        .result-label{text-align:center;font-size:16px;color:#888;margin-bottom:8px}
        .fill-row{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:8px}
        .fill-key{font-size:14px;color:#888}
        .fill-val{font-size:20px;font-weight:700;color:#2e7d32}
        .dimensions{text-align:center;font-size:13px;color:#888;margin-top:8px}
        .pallet-size{text-align:center;font-size:13px;color:#888;margin-top:4px}
        .error{color:#e74c3c;text-align:center;font-size:14px;margin-top:8px;display:none}
        .error.show{display:block}
    </style>
</head>
<body>
    <div class="container">
        <h1>Коробов в слое</h1>
        <div class="card">
            <label for="boxL">Длина коробки (см)</label>
            <input type="number" id="boxL" placeholder="например, 40" min="1" step="any">
            <label for="boxW">Ширина коробки (см)</label>
            <input type="number" id="boxW" placeholder="например, 26" min="1" step="any">
            <button class="btn" onclick="calculate()">Рассчитать</button>
            <div class="error" id="error"></div>
        </div>
        <div class="card result" id="result">
            <div class="result-label">Коробов в слое</div>
            <div class="result-count" id="count">0</div>
            <div class="fill-row">
                <span class="fill-key">Заполняемость</span>
                <span class="fill-val" id="fillPct">0%</span>
            </div>
            <div class="dimensions" id="dims"></div>
            <div class="pallet-size">Паллета 120 × 80 см</div>
        </div>
    </div>
    <script>
        var PL = 120;
        var PW = 80;
        var inpL = document.getElementById('boxL');
        var inpW = document.getElementById('boxW');

        function cnt(zw, zh, bw, bh) {
            return Math.floor(zw / bw) * Math.floor(zh / bh);
        }

        function getSplits(total, bw1, bw2) {
            var pts = {};
            pts[0] = 1;
            pts[total] = 1;
            for (var k = 1; k * bw1 <= total; k++) pts[k * bw1] = 1;
            for (var k = 1; k * bw2 <= total; k++) pts[k * bw2] = 1;
            for (var k = 0; k * bw1 < total; k++) pts[total - k * bw1] = 1;
            for (var k = 0; k * bw2 < total; k++) pts[total - k * bw2] = 1;
            var arr = [];
            for (var p in pts) {
                var v = parseInt(p);
                if (v > 0 && v < total) arr.push(v);
            }
            arr.sort(function(a, b) { return a - b; });
            return arr;
        }

        function findBest(bl, bw2) {
            var o = [{ w: bl, h: bw2 }, { w: bw2, h: bl }];
            var bc = 0;
            var bcfg = null;

            function t(c, cfg) {
                if (c > bc) { bc = c; bcfg = cfg; }
            }

            for (var i = 0; i < 2; i++) {
                t(cnt(PL, PW, o[i].w, o[i].h), { type: 's', o: [i] });
            }

            var xPts = getSplits(PL, bl, bw2);
            var yPts = getSplits(PW, bl, bw2);

            for (var si = 0; si < xPts.length; si++) {
                var s = xPts[si];
                for (var i = 0; i < 2; i++) {
                    for (var j = 0; j < 2; j++) {
                        t(cnt(s, PW, o[i].w, o[i].h) + cnt(PL - s, PW, o[j].w, o[j].h),
                          { type: 'v2', s: [s], o: [i, j] });
                    }
                }
            }

            for (var si = 0; si < yPts.length; si++) {
                var s = yPts[si];
                for (var i = 0; i < 2; i++) {
                    for (var j = 0; j < 2; j++) {
                        t(cnt(PL, s, o[i].w, o[i].h) + cnt(PL, PW - s, o[j].w, o[j].h),
                          { type: 'h2', s: [s], o: [i, j] });
                    }
                }
            }

            for (var xi = 0; xi < xPts.length; xi++) {
                for (var yi = 0; yi < yPts.length; yi++) {
                    var xs = xPts[xi];
                    var ys = yPts[yi];
                    for (var i = 0; i < 2; i++) {
                        for (var j = 0; j < 2; j++) {
                            for (var k = 0; k < 2; k++) {
                                for (var l = 0; l < 2; l++) {
                                    t(cnt(xs, ys, o[i].w, o[i].h) +
                                      cnt(PL - xs, ys, o[j].w, o[j].h) +
                                      cnt(xs, PW - ys, o[k].w, o[k].h) +
                                      cnt(PL - xs, PW - ys, o[l].w, o[l].h),
                                      { type: 'x', s: [xs, ys], o: [i, j, k, l] });
                                }
                            }
                        }
                    }
                }
            }

            var tn = {
                s: 'Обычная',
                v2: 'Смешанная (верт.)',
                h2: 'Смешанная (гориз.)',
                x: 'Смешанная'
            };

            return { total: bc, type: tn[bcfg.type] };
        }

        function showErr() {
            document.getElementById('error').textContent = '7 раз отмерь — 1 раз введи';
            document.getElementById('error').classList.add('show');
            document.getElementById('result').classList.remove('show');
        }

        function calculate() {
            var bl = parseFloat(inpL.value);
            var bw2 = parseFloat(inpW.value);

            inpL.classList.remove('err');
            inpW.classList.remove('err');

            if (!bl || bl <= 0) {
                inpL.classList.add('err');
                inpL.focus();
                showErr();
                return;
            }

            if (!bw2 || bw2 <= 0) {
                inpW.classList.add('err');
                inpW.focus();
                showErr();
                return;
            }

            var best = findBest(bl, bw2);

            if (!best.total) {
                inpL.classList.add('err');
                inpW.classList.add('err');
                showErr();
                return;
            }

            document.getElementById('error').classList.remove('show');
            var r = document.getElementById('result');
            r.classList.add('show');
            document.getElementById('count').textContent = best.total;
            document.getElementById('fillPct').textContent =
                ((best.total * bl * bw2) / (PL * PW) * 100).toFixed(1) + '%';
            document.getElementById('dims').textContent = 'Коробка ' + bl + ' × ' + bw2 + ' см';
            r.scrollIntoView({ behavior: 'smooth' });
        }

        inpL.addEventListener('input', function() {
            this.classList.remove('err');
        });

        inpW.addEventListener('input', function() {
            this.classList.remove('err');
        });

        inpL.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                inpW.focus();
            }
        });

        inpW.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                calculate();
            }
        });
    </script>
</body>
</html>
