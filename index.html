<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Мультитул оператора</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}

        :root{
            --bg:#f0f2f5; --card:#fff; --text:#1a1a2e; --text2:#555; --text3:#888;
            --accent:#4a90d9; --accent-hover:#357abd; --border:#e0e0e0; --err-bg:#fff0f0;
            --err-text:#e74c3c; --green:#2e7d32; --orange:#e67e22; --fill:#2e7d32;
            --result-text:#333; --input-bg:#fff; --input-text:#333; --tab-bg:#e8ecf1;
        }

        .dark{
            --bg:#1a1a2e; --card:#242440; --text:#e0e0e0; --text2:#aaa; --text3:#777;
            --accent:#5a9fe8; --accent-hover:#7ab3f0; --border:#3a3a5c; --err-bg:#3a1a1a;
            --err-text:#ff6b6b; --green:#4caf50; --orange:#ff9800; --fill:#4caf50;
            --result-text:#e0e0e0; --input-bg:#2a2a4a; --input-text:#e0e0e0; --tab-bg:#2a2a4a;
        }

        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:var(--bg);min-height:100vh;padding:16px;transition:background .3s ease;
        }
        .container{max-width:600px;margin:0 auto}

        .top-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;position:relative}
        h1{font-size:22px;color:var(--text);text-align:center}
        .theme-btn{
            position:absolute;right:0;top:50%;transform:translateY(-50%);
            background:none;border:none;font-size:24px;cursor:pointer;
            padding:4px 8px;border-radius:8px;
        }
        .theme-btn:hover{background:rgba(128,128,128,.2)}
        .theme-btn .icon-sun{display:none}
        .dark .theme-btn .icon-sun{display:inline}
        .dark .theme-btn .icon-moon{display:none}

        .section-title{
            text-align:center;font-size:18px;color:var(--accent);font-weight:700;
            margin:28px 0 16px;cursor:pointer;user-select:none;
            display:flex;align-items:center;justify-content:center;gap:10px;
        }
        .section-title .arrow{display:inline-block;transition:transform .2s ease;font-size:14px}
        .section-title .arrow.collapsed{transform:rotate(-90deg)}
        .collapsible{overflow:hidden;transition:max-height .2s ease,opacity .2s ease}
        .collapsible.collapsed{max-height:0!important;opacity:0;pointer-events:none}
        .collapsible.expanded{overflow:visible}

        .card{
            background:var(--card);border-radius:16px;padding:24px;margin-bottom:16px;
            box-shadow:0 2px 12px rgba(0,0,0,.08);transition:background .3s ease;
        }

        label{display:block;font-size:15px;color:var(--text2);margin-bottom:6px;font-weight:500}
        input,select{
            width:100%;padding:14px;font-size:18px;border:2px solid var(--border);
            border-radius:12px;outline:none;margin-bottom:16px;scroll-margin-bottom:220px;
            background:var(--input-bg);color:var(--input-text);
            transition:background .3s ease,color .3s ease;
        }
        input:focus,select:focus{border-color:var(--accent)}
        input.err,textarea.err{border-color:var(--err-text);background:var(--err-bg)}
        textarea{
            width:100%;padding:14px;font-size:16px;border:2px solid var(--border);
            border-radius:12px;outline:none;margin-bottom:12px;min-height:80px;
            resize:vertical;scroll-margin-bottom:220px;
            background:var(--input-bg);color:var(--input-text);font-family:inherit;
            transition:background .3s ease,color .3s ease;
        }
        textarea:focus{border-color:var(--accent)}

        .btn{
            width:100%;padding:16px;font-size:18px;font-weight:600;color:#fff;
            background:var(--accent);border:none;border-radius:12px;cursor:pointer;
            transition:background .3s ease;
        }
        .btn:hover{background:var(--accent-hover)}
        .btn-sm{
            width:auto;padding:10px 20px;font-size:14px;font-weight:600;
            color:var(--err-text);background:none;border:2px solid var(--err-text);
            border-radius:10px;cursor:pointer;margin:12px auto 0;display:block;
        }
        .btn-sm:hover{background:var(--err-bg)}

        .result{display:none}.result.show{display:block}
        .result-label{text-align:center;font-size:16px;color:var(--text3);margin-bottom:8px}
        .result-count{text-align:center;font-size:48px;font-weight:700;color:var(--accent)}
        .fill-row{display:flex;justify-content:center;align-items:baseline;gap:8px;margin-top:8px}
        .fill-key{font-size:14px;color:var(--text3)}
        .fill-val{font-size:20px;font-weight:700;color:var(--fill)}
        .dimensions{text-align:center;font-size:13px;color:var(--text3);margin-top:8px}
        .pallet-size{text-align:center;font-size:13px;color:var(--text3);margin-top:4px}
        .error{color:var(--err-text);text-align:center;font-size:15px;font-weight:600;margin-top:12px;display:none}
        .error.show{display:block}

        .row3{display:flex;gap:10px}
        .row3>div{flex:1}
        .row2{display:flex;gap:10px}
        .row2>div{flex:1}

        .expiry-out{text-align:center;font-size:22px;font-weight:700;color:var(--result-text);margin-bottom:12px}
        .left-out{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
        .left-out.red{color:var(--err-text)}
        .left-out.green{color:var(--green)}
        .left-out.orange{color:var(--orange)}

        .history-tabs{display:flex;gap:8px;margin-bottom:16px}
        .history-tab{
            flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;
            color:var(--text2);background:var(--tab-bg);border:2px solid transparent;
            border-radius:10px;cursor:pointer;transition:all .2s ease;user-select:none;
        }
        .history-tab.active{color:var(--accent);border-color:var(--accent);background:var(--card)}

        .history-list{list-style:none}
        .history-item{
            background:var(--card);border:1px solid var(--border);border-radius:12px;
            padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s ease;
        }
        .history-item:hover{border-color:var(--accent)}
        .h-input{font-size:14px;color:var(--text2);margin-bottom:4px;word-break:break-all}
        .h-result{font-size:15px;font-weight:700;color:var(--text)}
        .h-date{font-size:11px;color:var(--text3);margin-top:4px}

        .prefix-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;user-select:none}
        .prefix-row input[type=checkbox]{width:20px;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
        .prefix-row label{margin:0;font-size:15px;cursor:pointer}
        .prefix-input-wrap{display:none;margin-bottom:16px}
        .prefix-input-wrap.show{display:block}

        .code-type-tabs{display:flex;gap:10px;margin-bottom:16px}
        .code-type-btn{
            flex:1;padding:12px;font-size:14px;font-weight:600;
            background:var(--tab-bg);border:2px solid transparent;border-radius:10px;
            cursor:pointer;color:var(--text2);transition:all .2s ease;user-select:none;
        }
        .code-type-btn.active{
            background:var(--accent);color:#fff;border-color:var(--accent);
        }
        .code-type-btn:hover{border-color:var(--accent)}

        .code-grid{
            display:flex;
            flex-wrap:wrap;
            gap:16px;
            margin-top:16px;
            justify-content:center;
        }

        .code-item{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            background:#fff;
            border-radius:8px;
            padding:12px;
            flex: 0 0 calc(25% - 12px);
            min-width:140px;
        }

        .code-item canvas{
            image-rendering:pixelated;
            width:100%;
            height:auto;
            display:block;
            border:1px solid #ddd;
            border-radius:4px;
        }

        .code-item svg{
            width:100%;
            height:auto;
            display:block;
            border:1px solid #ddd;
            border-radius:4px;
        }

        .code-item .code-text{
            font-size:10px;
            color:#333;
            max-width:100%;
            word-break:break-all;
            text-align:center;
            line-height:1.2;
            overflow:hidden;
            text-overflow:ellipsis;
            display:-webkit-box;
            -webkit-line-clamp:2;
            -webkit-box-orient:vertical;
        }

        .download-row{
            display:flex;justify-content:center;align-items:center;gap:12px;
            margin:12px 0;flex-wrap:wrap;
        }

        .btn-download-icon{
            font-size:20px;cursor:pointer;transition:transform .2s ease;
        }
        .btn-download-icon:hover{transform:scale(1.2)}

        @media (max-width: 900px) {
            .code-item { flex: 0 0 calc(33.333% - 11px); }
        }
        @media (max-width: 600px) {
            .code-item { flex: 0 0 calc(50% - 8px); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-row">
        <h1>Мультитул оператора</h1>
        <button class="theme-btn" onclick="toggleTheme()" title="Сменить тему">
            <span class="icon-moon">🌙</span>
            <span class="icon-sun">☀️</span>
        </button>
    </div>

    <!-- КОРОБА -->
    <div class="section-title" onclick="toggleSection('section1',this)">
        <span class="arrow" id="arrow1">▼</span>Короба в слое
    </div>
    <div class="collapsible expanded" id="section1">
        <div class="card">
            <label for="boxL">Длина коробки (см)</label>
            <input type="text" inputmode="decimal" id="boxL" placeholder="например, 40 или 12,5">
            <label for="boxW">Ширина коробки (см)</label>
            <input type="text" inputmode="decimal" id="boxW" placeholder="например, 26 или 12,5">
            <button class="btn" onclick="calc()">Рассчитать</button>
            <div class="error" id="err"></div>
        </div>
        <div class="card result" id="result">
            <div class="result-label">Коробок в слое</div>
            <div class="result-count" id="count">0</div>
            <div class="fill-row">
                <span class="fill-key">Заполняемость</span>
                <span class="fill-val" id="fill">0%</span>
            </div>
            <div class="dimensions" id="dims"></div>
            <div class="pallet-size">Паллета 120 × 80 см</div>
        </div>
    </div>

    <!-- СРОКИ ГОДНОСТИ -->
    <div class="section-title" onclick="toggleSection('section2',this)">
        <span class="arrow" id="arrow2">▼</span>Сроки годности
    </div>
    <div class="collapsible expanded" id="section2">
        <div class="card">
            <label>Дата производства</label>
            <div class="row3">
                <div><select id="mfgDay"></select></div>
                <div><select id="mfgMonth"></select></div>
                <div><select id="mfgYear"></select></div>
            </div>
            <label for="shelfLife">Срок годности</label>
            <div class="row2">
                <div><input type="text" inputmode="numeric" id="shelfLife" placeholder="Кол-во" maxlength="5"></div>
                <div>
                    <select id="shelfUnit">
                        <option value="1">Сутки</option>
                        <option value="7">Недели</option>
                        <option value="30">Месяцы</option>
                        <option value="365">Годы</option>
                    </select>
                </div>
            </div>
            <button class="btn" onclick="calcShelf()">Рассчитать</button>
            <div class="error" id="shelfErr"></div>
        </div>
        <div class="card result" id="shelfResult">
            <div class="result-label">Годен до</div>
            <div class="expiry-out" id="expiryDate"></div>
            <div class="left-out" id="daysLeft"></div>
        </div>
    </div>

    <!-- ГЕНЕРАТОР ШК И QR -->
    <div class="section-title" onclick="toggleSection('section3',this)">
        <span class="arrow" id="arrow3">▼</span>Генератор ШК и QR
    </div>
    <div class="collapsible expanded" id="section3">
        <div class="card">
            <!-- Выбор типа кода -->
            <div class="code-type-tabs">
                <button class="code-type-btn active" id="btnQR" onclick="switchCodeType('qr')">QR-код</button>
                <button class="code-type-btn" id="btnBarcode" onclick="switchCodeType('barcode')">Штрихкод (ШК)</button>
            </div>

            <label for="codeInput">Текст (через пробел — отдельные коды)</label>
            <textarea id="codeInput" placeholder="Вставьте текст..."></textarea>

            <div class="prefix-row" onclick="togglePrefixInput()">
                <input type="checkbox" id="prefixCheck" onclick="event.stopPropagation();togglePrefixInput()">
                <label>Добавить текст в конец каждой строки</label>
            </div>
            <div class="prefix-input-wrap" id="prefixWrap">
                <label for="prefixVal">Текст</label>
                <input type="text" id="prefixVal">
            </div>

            <button class="btn" onclick="generateCode()">Сгенерировать</button>
            <div class="error" id="codeErr"></div>
        </div>
        <div class="card result" id="codeResult">
            <div class="download-row">
                <div class="result-label" id="codeResultLabel" style="flex:1;margin:0">QR-коды (0 шт.)</div>
                <span class="btn-download-icon" title="Скачать PNG" onclick="downloadAllPNG()">⤓</span>
            </div>
            <div class="code-grid" id="codeGrid"></div>
        </div>
    </div>

    <!-- ИСТОРИЯ -->
    <div class="section-title" onclick="toggleSection('section4',this)">
        <span class="arrow" id="arrow4">▼</span>История
    </div>
    <div class="collapsible expanded" id="section4">
        <div class="card">
            <div class="history-tabs">
                <div class="history-tab active" id="tabBoxes" onclick="switchHistoryTab('boxes')">Короба</div>
                <div class="history-tab" id="tabShelf" onclick="switchHistoryTab('shelf')">Сроки</div>
                <div class="history-tab" id="tabCode" onclick="switchHistoryTab('code')">ШК и QR</div>
            </div>
            <ul class="history-list" id="historyList"></ul>
            <button class="btn-sm" onclick="clearHistory()">Очистить историю</button>
        </div>
    </div>
</div>

<!-- ===== QR БИБЛИОТЕКА ===== -->
<script>
var qrcode = (function() {
    'use strict';

    var EXP = new Array(512), LOG = new Array(256);
    (function() {
        var x = 1;
        for (var i = 0; i < 255; i++) {
            EXP[i] = x;
            LOG[x] = i;
            x <<= 1;
            if (x & 0x100) x ^= 0x11D;
        }
        for (var i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
    })();

    function gfMul(a, b) {
        if (!a || !b) return 0;
        return EXP[LOG[a] + LOG[b]];
    }

    function rsGenPoly(degree) {
        var poly = [1];
        for (var i = 0; i < degree; i++) {
            var next = [];
            for (var k = 0; k <= poly.length; k++) next.push(0);
            for (var j = 0; j < poly.length; j++) {
                next[j + 1] ^= poly[j];
                next[j] ^= gfMul(poly[j], EXP[i]);
            }
            poly = next;
        }
        return poly.reverse();
    }

    function rsEncode(data, ecLen) {
        var gen = rsGenPoly(ecLen);
        var buf = data.slice();
        for (var i = 0; i < ecLen; i++) buf.push(0);
        for (var i = 0; i < data.length; i++) {
            var coef = buf[i];
            if (coef) {
                for (var j = 0; j < gen.length; j++)
                    buf[i + j] ^= gfMul(gen[j], coef);
            }
        }
        return buf.slice(data.length);
    }

    var RST = [

        [1,44,34],[1,44,28],[1,44,22],[1,44,16],

        [3,144,112,1,145,113],[5,65,41,5,66,42],[5,80,40,5,81,41],[13,45,20,4,46,21],
        [3,154,122,2,155,123],[7,73,45,3,74,46],[11,55,24,5,56,25],[17,45,20,4,46,21],

        [28,152,122,32,153,123],[29,74,46,14,75,47],[24,85,42,12,86,43],[24,45,20,46,46,21],
        [28,152,122,34,153,123],[13,74,46,32,75,47],[8,85,42,26,86,43],[42,45,20,32,46,21],
        [28,152,122,36,153,123],[40,75,47,7,76,48],[33,85,42,15,86,43],[10,45,20,67,46,21],
        [28,152,122,38,153,123],[18,75,47,31,76,48],[18,85,42,22,86,43],[20,45,20,61,46,21]
    ];

    function getRSBlocks(version, ecIdx) {
        var entry = RST[(version - 1) * 4 + ecIdx];
        var blocks = [];
        for (var i = 0; i < entry.length; i += 3) {
            for (var j = 0; j < entry[i]; j++) {
                blocks.push({ total: entry[i+1], data: entry[i+2], ec: entry[i+1] - entry[i+2] });
            }
        }
        return blocks;
    }

    function BB() { this.buf = []; this.len = 0; }
    BB.prototype.put = function(v, n) {
        for (var i = n - 1; i >= 0; i--) this.putBit((v >>> i) & 1);
    };
    BB.prototype.putBit = function(b) {
        var idx = Math.floor(this.len / 8);
        if (this.buf.length <= idx) this.buf.push(0);
        if (b) this.buf[idx] |= (0x80 >>> (this.len % 8));
        this.len++;
    };

    function utf8(s) {
        var out = [];
        for (var i = 0; i < s.length; i++) {
            var c = s.charCodeAt(i);
            if (c < 0x80) out.push(c);
            else if (c < 0x800) out.push(0xC0|(c>>6), 0x80|(c&0x3F));
            else if (c < 0xD800 || c >= 0xE000) out.push(0xE0|(c>>12), 0x80|((c>>6)&0x3F), 0x80|(c&0x3F));
            else {
                i++;
                var cp = 0x10000 + (((c&0x3FF)<<10)|(s.charCodeAt(i)&0x3FF));
                out.push(0xF0|(cp>>18), 0x80|((cp>>12)&0x3F), 0x80|((cp>>6)&0x3F), 0x80|(cp&0x3F));
            }
        }
        return out;
    }

    function bchD(d){var n=0;while(d){n++;d>>>=1;}return n;}
    function bchTI(data) {
        var d = data << 10;
        while (bchD(d) - bchD(0x537) >= 0) d ^= 0x537 << (bchD(d) - bchD(0x537));
        return ((data << 10) | d) ^ 0x5412;
    }
    function bchTN(data) {
        var d = data << 12;
        while (bchD(d) - bchD(0x1F25) >= 0) d ^= 0x1F25 << (bchD(d) - bchD(0x1F25));
        return (data << 12) | d;
    }

    var PAT = [
        [],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],
        [6,26,46],[6,28,50],[6,30,54],[6,32,58],[6,34,62],[6,26,46,66],
        [6,26,48,70],[6,26,50,74],[6,30,54,78],[6,30,56,82],[6,30,58,86],
        [6,34,62,90],[6,28,50,72,94],[6,26,50,74,98],[6,30,54,78,102],
        [6,28,54,80,106],[6,32,58,84,110],[6,30,58,86,114],[6,34,62,90,118],
        [6,26,50,74,98,122],[6,30,54,78,102,126],[6,26,52,78,104,130],
        [6,30,56,82,108,134],[6,34,60,86,112,138],[6,30,58,86,114,142],
        [6,34,62,90,118,146],[6,30,54,78,102,126,150],[6,24,50,76,102,128,154],
        [6,28,54,80,106,132,158],[6,32,58,84,110,136,162],[6,26,54,82,110,138,166],
        [6,30,58,86,114,142,170]
    ];

    function mFn(p,i,j) {
        switch(p) {
            case 0: return (i+j)%2==0;
            case 1: return i%2==0;
            case 2: return j%3==0;
            case 3: return (i+j)%3==0;
            case 4: return (Math.floor(i/2)+Math.floor(j/3))%2==0;
            case 5: return (i*j)%2+(i*j)%3==0;
            case 6: return ((i*j)%2+(i*j)%3)%2==0;
            case 7: return ((i*j)%3+(i+j)%2)%2==0;
        }
    }

    function penalty(m, mc) {
        var lost = 0;
        for (var r = 0; r < mc; r++) for (var c = 0; c < mc; c++) {
            var s = 0, d = m[r][c];
            for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) {
                if (r+dr<0||r+dr>=mc||c+dc<0||c+dc>=mc||(dr==0&&dc==0)) continue;
                if (d == m[r+dr][c+dc]) s++;
            }
            if (s > 5) lost += 3 + s - 5;
        }
        for (var r = 0; r < mc-1; r++) for (var c = 0; c < mc-1; c++) {
            var cnt = (m[r][c]?1:0)+(m[r+1][c]?1:0)+(m[r][c+1]?1:0)+(m[r+1][c+1]?1:0);
            if (cnt==0||cnt==4) lost += 3;
        }
        for (var r = 0; r < mc; r++) for (var c = 0; c < mc-6; c++)
            if (m[r][c]&&!m[r][c+1]&&m[r][c+2]&&m[r][c+3]&&m[r][c+4]&&!m[r][c+5]&&m[r][c+6]) lost+=40;
        for (var c = 0; c < mc; c++) for (var r = 0; r < mc-6; r++)
            if (m[r][c]&&!m[r+1][c]&&m[r+2][c]&&m[r+3][c]&&m[r+4][c]&&!m[r+5][c]&&m[r+6][c]) lost+=40;
        var dark = 0;
        for (var r = 0; r < mc; r++) for (var c = 0; c < mc; c++) if (m[r][c]) dark++;
        lost += Math.abs(100*dark/mc/mc - 50)/5*10;
        return lost;
    }

    function build(text, ecLevel) {
        var ecMap = { L:0, M:1, Q:2, H:3 };
        var ecIdx = ecMap[ecLevel] !== undefined ? ecMap[ecLevel] : 1;
        var ecBits = { L:1, M:0, Q:3, H:2 };
        var ecVal = ecBits[ecLevel] !== undefined ? ecBits[ecLevel] : 0;
        var data = utf8(text);

        var ver = 0;
        for (var t = 1; t <= 40; t++) {
            var blks = getRSBlocks(t, ecIdx);
            var totalData = 0;
            for (var i = 0; i < blks.length; i++) totalData += blks[i].data;
            var lenBits = t < 10 ? 8 : 16;
            var needed = 4 + lenBits + data.length * 8;
            if (needed <= totalData * 8) { ver = t; break; }
        }
        if (!ver) throw new Error('Данные слишком длинные для кодирования QR');

        var blocks = getRSBlocks(ver, ecIdx);
        var mc = ver * 4 + 17;

        var buf = new BB();
        buf.put(4, 4);
        buf.put(data.length, ver < 10 ? 8 : 16);
        for (var i = 0; i < data.length; i++) buf.put(data[i], 8);
        var totalData = 0;
        for (var i = 0; i < blocks.length; i++) totalData += blocks[i].data;
        if (buf.len + 4 <= totalData * 8) buf.put(0, 4);
        while (buf.len % 8) buf.putBit(0);
        var pad = [0xEC, 0x11], pi = 0;
        while (buf.len < totalData * 8) buf.put(pad[pi++ % 2], 8);

        var allData = buf.buf;
        var dcB = [], ecB = [], off = 0;
        for (var i = 0; i < blocks.length; i++) {
            var d = allData.slice(off, off + blocks[i].data);
            off += blocks[i].data;
            dcB.push(d);
            ecB.push(rsEncode(d, blocks[i].ec));
        }

        var maxD = 0, maxE = 0;
        for (var i = 0; i < blocks.length; i++) {
            if (dcB[i].length > maxD) maxD = dcB[i].length;
            if (ecB[i].length > maxE) maxE = ecB[i].length;
        }
        var cw = [];
        for (var i = 0; i < maxD; i++) for (var j = 0; j < blocks.length; j++)
            if (i < dcB[j].length) cw.push(dcB[j][i]);
        for (var i = 0; i < maxE; i++) for (var j = 0; j < blocks.length; j++)
            if (i < ecB[j].length) cw.push(ecB[j][i]);

        function makeMat(mask) {
            var m = [];
            for (var r = 0; r < mc; r++) {
                m[r] = [];
                for (var c = 0; c < mc; c++) m[r][c] = null;
            }

            function probe(row, col) {
                for (var r = -1; r <= 7; r++) {
                    if (row+r<0||row+r>=mc) continue;
                    for (var c = -1; c <= 7; c++) {
                        if (col+c<0||col+c>=mc) continue;
                        if ((r>=0&&r<=6&&(c==0||c==6))||(c>=0&&c<=6&&(r==0||r==6))||(r>=2&&r<=4&&c>=2&&c<=4))
                            m[row+r][col+c] = true;
                        else
                            m[row+r][col+c] = false;
                    }
                }
            }
            probe(0,0); probe(mc-7,0); probe(0,mc-7);

            var pos = PAT[ver-1] || [];
            for (var i = 0; i < pos.length; i++) for (var j = 0; j < pos.length; j++) {
                var row = pos[i], col = pos[j];
                if (m[row][col] != null) continue;
                for (var r = -2; r <= 2; r++) for (var c = -2; c <= 2; c++)
                    m[row+r][col+c] = (r==-2||r==2||c==-2||c==2||(r==0&&c==0));
            }

            for (var r = 8; r < mc-8; r++) if (m[r][6]==null) m[r][6] = (r%2==0);
            for (var c = 8; c < mc-8; c++) if (m[6][c]==null) m[6][c] = (c%2==0);

            m[mc-8][8] = true;

            var fi = bchTI((ecVal << 3) | mask);
            for (var i = 0; i < 15; i++) {
                var mod = ((fi >> i) & 1) == 1;
                if (i < 6) m[i][8] = mod;
                else if (i < 8) m[i+1][8] = mod;
                else m[mc-15+i][8] = mod;
            }
            for (var i = 0; i < 15; i++) {
                var mod = ((fi >> i) & 1) == 1;
                if (i < 8) m[8][mc-i-1] = mod;
                else if (i < 9) m[8][15-i-1+1] = mod;
                else m[8][15-i-1] = mod;
            }

            if (ver >= 7) {
                var vn = bchTN(ver);
                for (var i = 0; i < 18; i++) {
                    var mod = ((vn >> i) & 1) == 1;
                    m[Math.floor(i/3)][i%3+mc-8-3] = mod;
                }
                for (var i = 0; i < 18; i++) {
                    var mod = ((vn >> i) & 1) == 1;
                    m[i%3+mc-8-3][Math.floor(i/3)] = mod;
                }
            }

            var inc = -1, row = mc-1, bitIdx = 7, byteIdx = 0;
            for (var col = mc-1; col > 0; col -= 2) {
                if (col == 6) col--;
                while (true) {
                    for (var c = 0; c < 2; c++) {
                        if (m[row][col-c] == null) {
                            var dark = false;
                            if (byteIdx < cw.length)
                                dark = ((cw[byteIdx] >>> bitIdx) & 1) == 1;
                            if (mFn(mask, row, col-c)) dark = !dark;
                            m[row][col-c] = dark;
                            bitIdx--;
                            if (bitIdx == -1) { byteIdx++; bitIdx = 7; }
                        }
                    }
                    row += inc;
                    if (row < 0 || row >= mc) { row -= inc; inc = -inc; break; }
                }
            }

            return m;
        }

        var bestMask = 0, bestPen = Infinity;
        for (var mask = 0; mask < 8; mask++) {
            var mm = makeMat(mask);
            var p = penalty(mm, mc);
            if (p < bestPen) { bestPen = p; bestMask = mask; }
        }

        var final = makeMat(bestMask);
        return {
            getModuleCount: function() { return mc; },
            isDark: function(r, c) { return !!final[r][c]; }
        };
    }

    return {
        create: build,
        render: function(canvas, text, ecLevel, scale) {
            var qr = build(text, ecLevel || 'M');
            var count = qr.getModuleCount();
            var qz = 8;
            var total = count + qz * 2;
            var px = scale || 8;
            canvas.width = total * px;
            canvas.height = total * px;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000';
            for (var r = 0; r < count; r++)
                for (var c = 0; c < count; c++)
                    if (qr.isDark(r, c))
                        ctx.fillRect((c + qz) * px, (r + qz) * px, px, px);
        }
    };
})();
</script>

<!-- ===== BARCODE БИБЛИОТЕКА (CODE128) ===== -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<!-- ===== ПРИЛОЖЕНИЕ ===== -->
<script>
    /* ===== Форматирование чисел ===== */
    function fmtNumber(n) {
        return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    }

    /* ===== Тема ===== */
    function toggleTheme() {
        document.body.classList.toggle('dark');
        localStorage.setItem('darkTheme', document.body.classList.contains('dark') ? '1' : '0');
    }
    (function() {
        var saved = localStorage.getItem('darkTheme');
        if (saved === '1') document.body.classList.add('dark');
        else if (saved === '0') document.body.classList.remove('dark');
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
            document.body.classList.add('dark');
    })();

    /* ===== Состояние секций ===== */
    var sectionStates = {
        section1: true,
        section2: true,
        section3: true,
        section4: true
    };

    /* ===== Сворачивание ===== */
    function toggleSection(id, el) {
        var section = document.getElementById(id);
        var arrow = el.querySelector('.arrow');
        if (section.classList.contains('collapsed')) {
            section.style.maxHeight = section.scrollHeight + 'px';
            section.classList.remove('collapsed');
            section.classList.add('expanded');
            arrow.classList.remove('collapsed');
            sectionStates[id] = true;
            setTimeout(function() { section.style.maxHeight = 'none'; }, 200);
        } else {
            section.style.maxHeight = section.scrollHeight + 'px';
            section.offsetHeight;
            section.classList.add('collapsed');
            section.classList.remove('expanded');
            arrow.classList.add('collapsed');
            sectionStates[id] = false;
            section.style.maxHeight = '0px';
        }
        saveSectionStates();
    }

    function saveSectionStates() {
        try { 
            localStorage.setItem('sectionStates', JSON.stringify(sectionStates)); 
        } catch(e) {}
    }

    function loadSectionStates() {
        try {
            var saved = localStorage.getItem('sectionStates');
            if (saved) {
                sectionStates = JSON.parse(saved);
                for (var sectionId in sectionStates) {
                    var section = document.getElementById(sectionId);
                    var arrow = document.querySelector('[onclick*="toggleSection(\''+sectionId+'\'"] .arrow');
                    if (section && arrow) {
                        if (sectionStates[sectionId]) {
                            section.classList.remove('collapsed');
                            section.classList.add('expanded');
                            arrow.classList.remove('collapsed');
                        } else {
                            section.classList.add('collapsed');
                            section.classList.remove('expanded');
                            arrow.classList.add('collapsed');
                        }
                    }
                }
            }
        } catch(e) {}
    }

    /* ===== Парсинг ===== */
    function parseNum(s) {
        if (!s) return NaN;
        return parseFloat(String(s).replace(',', '.'));
    }
    function pad(n) { return n < 10 ? '0' + n : '' + n; }

    /* ===== Месяцы ===== */
    var months = [
        'Январь (01)', 'Февраль (02)', 'Март (03)', 'Апрель (04)',
        'Май (05)', 'Июнь (06)', 'Июль (07)', 'Август (08)',
        'Сентябрь (09)', 'Октябрь (10)', 'Ноябрь (11)', 'Декабрь (12)'
    ];

    /* ===== Калькулятор 1 ===== */
    var L = 120, W = 80;
    var calcCache = {};

    function n(zw, zh, bw, bh) {
        return Math.floor(zw / bw) * Math.floor(zh / bh);
    }

    function pts(total, d1, d2) {
        var s = {}, o = [];
        for (var k = 1; k * d1 <= total; k++) s[k * d1] = 1;
        for (var k = 1; k * d2 <= total; k++) s[k * d2] = 1;
        for (var k = 0; k * d1 < total; k++) s[total - k * d1] = 1;
        for (var k = 0; k * d2 < total; k++) s[total - k * d2] = 1;
        for (var p in s) { var v = +p; if (v > 0 && v < total) o.push(v); }
        return o.sort(function(a, b) { return a - b; });
    }

    function best(bl, bw) {
        var cacheKey = bl + '_' + bw;
        if (calcCache[cacheKey]) return calcCache[cacheKey];

        var o = [{w:bl,h:bw},{w:bw,h:bl}];
        var bc = 0, cfg;
        function t(c, x) { if (c > bc) { bc = c; cfg = x; } }

        for (var i = 0; i < 2; i++) t(n(L,W,o[i].w,o[i].h), {t:'s'});

        var xp = pts(L, bl, bw), yp = pts(W, bl, bw);

        for (var s of xp) for (var i = 0; i < 2; i++) for (var j = 0; j < 2; j++)
            t(n(s,W,o[i].w,o[i].h) + n(L-s,W,o[j].w,o[j].h), {t:'v2'});

        for (var s of yp) for (var i = 0; i < 2; i++) for (var j = 0; j < 2; j++)
            t(n(L,s,o[i].w,o[i].h) + n(L,W-s,o[j].w,o[j].h), {t:'h2'});

        for (var xs of xp) for (var ys of yp)
            for (var i = 0; i < 2; i++) for (var j = 0; j < 2; j++)
            for (var k = 0; k < 2; k++) for (var l = 0; l < 2; l++)
                t(n(xs,ys,o[i].w,o[i].h) + n(L-xs,ys,o[j].w,o[j].h) +
                  n(xs,W-ys,o[k].w,o[k].h) + n(L-xs,W-ys,o[l].w,o[l].h), {t:'x'});

        var names = { s:'Обычная', v2:'Смешанная (верт.)', h2:'Смешанная (гориз.)', x:'Смешанная' };
        var result = { total: bc, type: names[cfg ? cfg.t : 's'] };
        calcCache[cacheKey] = result;
        return result;
    }

    function calc() {
        var bl = parseNum(document.getElementById('boxL').value);
        var bw = parseNum(document.getElementById('boxW').value);
        var el1 = document.getElementById('boxL'), el2 = document.getElementById('boxW');
        el1.classList.remove('err'); el2.classList.remove('err');

        if (!bl || bl <= 0) { el1.classList.add('err'); el1.focus(); fail(); return; }
        if (!bw || bw <= 0) { el2.classList.add('err'); el2.focus(); fail(); return; }

        var r = best(bl, bw);
        if (!r.total) { el1.classList.add('err'); el2.classList.add('err'); fail(); return; }

        document.getElementById('err').classList.remove('show');
        var res = document.getElementById('result');
        res.classList.add('show');
        document.getElementById('count').textContent = fmtNumber(r.total);
        var fillPct = ((r.total*bl*bw)/(L*W)*100).toFixed(1);
        document.getElementById('fill').textContent = fillPct+'%';
        document.getElementById('dims').textContent = 'Коробка ' + bl + ' × ' + bw + ' см';
        res.scrollIntoView({behavior:'smooth'});
        saveToHistory('boxes', bl+' × '+bw, fmtNumber(r.total)+' шт.', {bl:bl,bw:bw});
    }

    function fail() {
        document.getElementById('err').textContent = '7 раз отмерь — 1 раз введи';
        document.getElementById('err').classList.add('show');
        document.getElementById('result').classList.remove('show');
    }

    /* ===== Калькулятор 2 ===== */
    function initShelfSelects() {
        var d = document.getElementById('mfgDay');
        var m = document.getElementById('mfgMonth');
        var y = document.getElementById('mfgYear');
        d.innerHTML = '<option value="">День</option>';
        for (var i = 1; i <= 31; i++) d.innerHTML += '<option value="'+i+'">'+i+'</option>';
        m.innerHTML = '<option value="">Месяц</option>';
        for (var i = 0; i < 12; i++) {
            m.innerHTML += '<option value="'+(i+1)+'">'+months[i]+'</option>';
        }
        y.innerHTML = '<option value="">Год</option>';
        var now = new Date();
        for (var i = now.getFullYear(); i > now.getFullYear()-10; i--)
            y.innerHTML += '<option value="'+i+'">'+i+'</option>';
    }

    function isValidDate(d, m, y) {
        var test = new Date(y, m-1, d);
        return test.getDate() === d && test.getMonth() === m-1 && test.getFullYear() === y;
    }

    function calcShelf() {
        var d = +document.getElementById('mfgDay').value;
        var m = +document.getElementById('mfgMonth').value;
        var y = +document.getElementById('mfgYear').value;
        var qty = parseInt(document.getElementById('shelfLife').value);
        var unit = +document.getElementById('shelfUnit').value;

        if (!d||!m||!y) { shelfErr('Укажите дату производства'); return; }
        if (!isValidDate(d, m, y)) { shelfErr('Неверная дата'); return; }
        if (!qty||qty<=0) { shelfErr('Укажите срок годности'); return; }

        document.getElementById('shelfErr').classList.remove('show');
        var mfg = new Date(y, m-1, d);

        var exp = new Date(mfg);
        var unitText = document.getElementById('shelfUnit').selectedOptions[0].text;

        if (unit===30) exp.setMonth(exp.getMonth()+qty);
        else if (unit===365) exp.setFullYear(exp.getFullYear()+qty);
        else exp.setDate(exp.getDate()+qty*unit);

        var now = new Date(); now.setHours(0,0,0,0);
        var expMid = new Date(exp); expMid.setHours(0,0,0,0);
        var diff = Math.round((expMid-now)/86400000);
        var total = Math.round((expMid-mfg)/86400000);

        document.getElementById('shelfResult').classList.add('show');
        document.getElementById('expiryDate').textContent = fmtDate(exp);
        var el = document.getElementById('daysLeft');
        el.className = 'left-out';

        if (diff<0) {
            el.textContent = 'Просрочено на '+fmtDays(-diff);
            el.classList.add('red');
        } else if (diff===0) {
            el.textContent = 'Истекает сегодня';
            el.classList.add('orange');
        } else {
            var pct = total>0 ? Math.round(diff/total*100) : 0;
            el.textContent = 'Осталось '+fmtDays(diff)+' ('+pct+'%)';
            el.classList.add(pct>20?'green':'orange');
        }

        saveToHistory('shelf', pad(d)+'.'+pad(m)+'.'+y+' + '+qty+' '+unitText, fmtDate(exp),
            {d:d,m:m,y:y,qty:qty,unit:unit});
    }

    function shelfErr(msg) {
        document.getElementById('shelfErr').textContent = msg;
        document.getElementById('shelfErr').classList.add('show');
        document.getElementById('shelfResult').classList.remove('show');
    }

    function fmtDate(dt) {
        return pad(dt.getDate())+'.'+pad(dt.getMonth()+1)+'.'+dt.getFullYear();
    }

    function fmtDays(n) {
        if (n===0) return '0 дней';
        var l1=n%10, l2=n%100;
        if (l1===1&&l2!==11) return n+' день';
        if (l1>=2&&l1<=4&&(l2<12||l2>14)) return n+' дня';
        return n+' дней';
    }

    /* ===== Калькулятор 3: ШК И QR ===== */
    var currentCodeType = 'qr';

    function switchCodeType(type) {
        // Просто переключаемся - текст остается без изменений
        currentCodeType = type;
        
        document.getElementById('btnQR').classList.toggle('active', type === 'qr');
        document.getElementById('btnBarcode').classList.toggle('active', type === 'barcode');
    }

    function togglePrefixInput() {
        var cb = document.getElementById('prefixCheck');
        document.getElementById('prefixWrap').classList.toggle('show', cb.checked);
    }

    function generateCode() {
        var raw = document.getElementById('codeInput').value.trim();
        if (!raw) { codeFail('Введите текст'); return; }

        var parts = raw.split(/\s+/).filter(Boolean);
        if (!parts.length) { codeFail('Введите текст'); return; }

        var usePrefix = document.getElementById('prefixCheck').checked;
        var prefix = usePrefix ? document.getElementById('prefixVal').value.trim() : '';

        var grid = document.getElementById('codeGrid');
        grid.innerHTML = '';
        document.getElementById('codeErr').classList.remove('show');

        var failedItems = [];

        try {
            if (currentCodeType === 'qr') {
                for (var i = 0; i < parts.length; i++) {
                    var text = parts[i] + prefix;
                    try {
                        var item = document.createElement('div');
                        item.className = 'code-item';
                        var canvas = document.createElement('canvas');
                        qrcode.render(canvas, text, 'M', 5);
                        item.appendChild(canvas);
                        var label = document.createElement('div');
                        label.className = 'code-text';
                        label.textContent = text;
                        item.appendChild(label);
                        grid.appendChild(item);
                    } catch(e) {
                        failedItems.push(text);
                    }
                }
            } else if (currentCodeType === 'barcode') {
                for (var i = 0; i < parts.length; i++) {
                    var text = parts[i] + prefix;
                    try {
                        var item = document.createElement('div');
                        item.className = 'code-item';
                        var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                        item.appendChild(svg);
                        JsBarcode(svg, text, {
                            format: 'CODE128',
                            width: 4,
                            height: 100,
                            margin: 8,
                            lineColor: '#000',
                            background: '#fff'
                        });
                        var label = document.createElement('div');
                        label.className = 'code-text';
                        label.textContent = text;
                        item.appendChild(label);
                        grid.appendChild(item);
                    } catch(e) {
                        failedItems.push(text);
                    }
                }
            }
        } catch(e) {
            codeFail('Ошибка: ' + e.message);
            return;
        }

        if (grid.children.length === 0) {
            codeFail('Не удалось закодировать текст. Попробуйте сокращенный текст.');
            return;
        }

        var typeLabel = currentCodeType === 'qr' ? 'QR-коды' : 'Штрихкоды';
        var successCount = grid.children.length;
        
        if (failedItems.length > 0) {
            document.getElementById('codeResultLabel').textContent = 
                typeLabel + ' ('+successCount+' из '+(parts.length)+' успешно)';
        } else {
            document.getElementById('codeResultLabel').textContent = typeLabel + ' ('+successCount+' шт.)';
        }

        document.getElementById('codeResult').classList.add('show');
        document.getElementById('codeResult').scrollIntoView({behavior:'smooth'});
        saveToHistory('code', raw, successCount + ' ' + (successCount%10===1?'код':'кодов'), {});
    }

    function codeFail(msg) {
        document.getElementById('codeErr').textContent = msg;
        document.getElementById('codeErr').classList.add('show');
        document.getElementById('codeResult').classList.remove('show');
    }

    function downloadAllPNG() {
        var grid = document.getElementById('codeGrid');
        var items = grid.querySelectorAll('.code-item');
        
        if (items.length === 0) {
            alert('Коды не сгенерированы');
            return;
        }

        var itemWidth = 160;
        var itemHeight = 160;
        var gap = 16;
        var cols = 4;
        var rows = Math.ceil(items.length / cols);

        var canvasWidth = cols * itemWidth + (cols - 1) * gap;
        var canvasHeight = rows * itemHeight + (rows - 1) * gap;

        var canvas = document.createElement('canvas');
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        var ctx = canvas.getContext('2d');

        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        var promises = [];

        items.forEach(function(item, idx) {
            var row = Math.floor(idx / cols);
            var col = idx % cols;
            var x = col * (itemWidth + gap);
            var y = row * (itemHeight + gap);

            var codeElem = item.querySelector('canvas');
            var svgElem = item.querySelector('svg');
            var textElem = item.querySelector('.code-text');

            if (codeElem) {
                ctx.drawImage(codeElem, x + 20, y + 10, 120, 120);
                
                if (textElem) {
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    var text = textElem.textContent;
                    ctx.fillText(text.substring(0, 16), x + itemWidth / 2, y + 145);
                }
            } else if (svgElem) {
                var svgString = new XMLSerializer().serializeToString(svgElem);
                var svg = new Blob([svgString], { type: 'image/svg+xml' });
                var url = URL.createObjectURL(svg);
                var img = new Image();
                
                promises.push(new Promise(function(resolve) {
                    img.onload = function() {
                        ctx.drawImage(img, x + 15, y + 20, 130, 90);
                        if (textElem) {
                            ctx.fillStyle = '#000';
                            ctx.font = 'bold 10px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText(textElem.textContent.substring(0, 16), x + itemWidth / 2, y + 145);
                        }
                        URL.revokeObjectURL(url);
                        resolve();
                    };
                    img.onerror = function() {
                        URL.revokeObjectURL(url);
                        resolve();
                    };
                    img.src = url;
                }));
            }
        });

        if (promises.length > 0) {
            Promise.all(promises).then(function() {
                downloadCanvas(canvas);
            });
        } else {
            downloadCanvas(canvas);
        }
    }

    function downloadCanvas(canvas) {
        var link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = 'codes_' + new Date().getTime() + '.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    /* ===== История ===== */
    var currentHistoryTab = 'boxes';

    function getHistoryData() {
        try {
            var data = localStorage.getItem('historyData');
            return data ? JSON.parse(data) : {boxes:[], shelf:[], code:[]};
        } catch(e) {
            return {boxes:[], shelf:[], code:[]};
        }
    }

    function saveHistoryData(data) {
        try {
            localStorage.setItem('historyData', JSON.stringify(data));
        } catch(e) {}
    }

    function saveToHistory(type, input, result, data) {
        var historyData = getHistoryData();
        
        if (!historyData[type]) {
            historyData[type] = [];
        }
        
        var entry = {
            input: input,
            result: result,
            date: new Date().toLocaleString('ru-RU'),
            data: data
        };
        
        historyData[type].unshift(entry);
        if (historyData[type].length > 50) historyData[type].pop();
        
        saveHistoryData(historyData);
        renderHistory();
    }

    function renderHistory() {
        var historyData = getHistoryData();
        var type = currentHistoryTab;
        var list = document.getElementById('historyList');
        list.innerHTML = '';
        
        var items = historyData[type] || [];
        if (items.length === 0) {
            list.innerHTML = '<li style="text-align:center;color:var(--text3);padding:20px">История пуста</li>';
            return;
        }
        
        for (var i = 0; i < items.length; i++) {
            var item = items[i];
            var li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = 
                '<div class="h-input">Ввод: ' + (item.input || '') + '</div>' +
                '<div class="h-result">Результат: ' + (item.result || '') + '</div>' +
                '<div class="h-date">' + (item.date || '') + '</div>';
            list.appendChild(li);
        }
    }

    function switchHistoryTab(tab) {
        currentHistoryTab = tab;
        document.querySelectorAll('.history-tab').forEach(function(el) {
            el.classList.toggle('active', el.id === 'tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
        });
        renderHistory();
    }

    function clearHistory() {
        if (confirm('Очистить всю историю?')) {
            localStorage.removeItem('historyData');
            renderHistory();
        }
    }

    /* ===== Инициализация ===== */
    function initApp() {
        initShelfSelects();
        loadSectionStates();
        renderHistory();
        
        var historyData = getHistoryData();
        if (!historyData.code) historyData.code = [];
        saveHistoryData(historyData);
    }

    window.addEventListener('DOMContentLoaded', initApp);
</script>
